<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CS Leave</title>
<meta name="theme-color" content="#0b1f36">
<script>
  /* 先套用記住的主題，避免打開時閃一下別的顏色 */
  try { var t = localStorage.getItem('leave_theme'); if (['d','e','k','m4','m5'].indexOf(t) >= 0) document.documentElement.className = 'theme-' + t; } catch (e) {}
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CS Leave">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232563eb'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='700'%3E假%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%232563eb'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='700'%3E假%3C/text%3E%3C/svg%3E">
<style>
  :root { --bg:#f3f4f6; --card:#fff; --text:#111827; --muted:#6b7280; --line:#e5e7eb; --accent:#2563eb; --bad:#dc2626; --soft:#f9fafb; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { overscroll-behavior-y:contain; }   /* 關掉瀏覽器自己的下拉重整，改用下面的 */
  body { margin:0; font-family:-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif; background:var(--bg); color:var(--text); font-size:15px; }
  select, input, textarea, button { font:inherit; }
  select, input, textarea { padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:#fff; width:100%; }
  button { border:0; border-radius:10px; padding:9px 14px; cursor:pointer; background:#eef2ff; color:var(--accent); }
  button.primary { background:var(--accent); color:#fff; }
  button.ghost { background:transparent; color:var(--muted); padding:6px 8px; font-size:13px; }
  button.danger { background:#fee2e2; color:var(--bad); padding:6px 10px; font-size:13px; flex-shrink:0; }
  button:disabled { opacity:.6; }

  /* 標頭 */
  header { background:var(--card); padding:10px 16px; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5;
           display:flex; align-items:center; justify-content:space-between; gap:8px; }
  header h1 { margin:0; font-size:17px; white-space:nowrap; }
  .me { display:flex; align-items:center; gap:2px; min-width:0; }
  .avatar { width:28px; height:28px; border-radius:50%; color:#fff; font-size:13px; font-weight:700;
            display:inline-flex; align-items:center; justify-content:center; margin-right:6px; flex-shrink:0; }
  .me b { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-right:4px; }

  main { padding:12px 12px calc(96px + env(safe-area-inset-bottom)); max-width:760px; margin:0 auto; }
  .card { background:var(--card); border-radius:14px; padding:12px; margin-bottom:12px; box-shadow:0 1px 2px rgba(0,0,0,.05); }
  .muted { color:var(--muted); font-size:13px; }

  /* 月曆 */
  .nav { display:flex; align-items:center; gap:6px; margin-bottom:8px; }
  .nav .title { flex:1; font-size:18px; font-weight:700; padding-left:4px; }
  /* 點月份標題 → 選年月 */
  .ym-btn { cursor:pointer; display:inline-flex; align-items:center; gap:4px; border-radius:8px; padding:2px 4px; margin-left:-4px; }
  .ym-btn:active { background:rgba(0,0,0,.06); }
  .ym-caret { font-style:normal; font-size:11px; color:var(--muted); }
  #ymMask { z-index:12; }
  .ym-year { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .ym-year b { font-size:20px; letter-spacing:.04em; }
  .ym-year button { width:40px; height:36px; padding:0; font-size:18px; }
  .ym-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .ym-grid button { padding:14px 0; font-size:15px; font-weight:600; background:var(--soft); color:var(--text); border:1.5px solid var(--line); }
  .ym-grid button.now { border-color:#c9a227; }
  .ym-grid button.sel { background:var(--accent); color:#fff; border-color:var(--accent); }
  .nav button { height:34px; padding:0 12px; font-size:14px; }
  .nav .arrow { width:34px; padding:0; font-size:18px; }
  .grid { display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); gap:4px 3px; }
  .wd { text-align:center; font-size:12px; color:var(--muted); padding:2px 0 6px; font-weight:600; }
  .wd.we { color:#b0b6bf; }
  .day { min-height:60px; border-radius:10px; background:#f8fafc; padding:4px 3px; font-size:12px; cursor:pointer;
         min-width:0; overflow:hidden; text-align:center; transition:background .15s; }
  .day:active { background:#e0e7ff; }
  .day.empty { background:transparent; cursor:default; }
  .day.weekend { background:transparent; }
  .day.weekend .num { color:#b0b6bf; }
  .day.past { opacity:.38; }
  .day.full { background:#fff7ed; }
  .day.holiday { background:#fef2f2; }
  .day.holiday .num { color:var(--bad); }
  .num { display:inline-flex; width:24px; height:24px; align-items:center; justify-content:center; border-radius:50%;
         font-weight:600; font-size:13px; }
  .day.today .num { background:#111827; color:#fff; }   /* 今天：深色圓圈（不用藍色，避免跟 Jessie 的藍色混淆） */
  .day { position:relative; }
  .hint { font-size:12px; color:var(--muted); text-align:center; margin-top:8px; }
  .hname { display:block; color:var(--bad); font-size:10px; line-height:1.3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hname.work { color:var(--accent); }

  /* 月曆格子：平常一整格；有人請半天才分成上（上午）下（下午）兩格 */
  .slots { display:flex; flex-direction:column; gap:2px; margin-top:3px; height:36px; }
  .slots .row { display:flex; gap:2px; flex:1; min-height:0; }
  .stripe { flex:1; border-radius:5px; background:repeating-linear-gradient(135deg, transparent 0 4px, rgba(0,0,0,.035) 4px 8px);
            box-shadow:inset 0 0 0 1px rgba(0,0,0,.05); }
  .seg { flex:1; min-width:0; border-radius:5px; display:flex; align-items:center; justify-content:center;
         font-size:11px; font-weight:800; color:#fff; border:1.5px solid transparent; line-height:1; overflow:hidden; }
  .seg.alt { background:#fff !important; }   /* 代理OP：空心框 */
  /* 鉛筆假：像鉛筆畫的斜線，表示暫定、可以塗改 */
  .seg.pencil, .ini-lg.pencil { background:repeating-linear-gradient(135deg, var(--c) 0 1.5px, #fff 1.5px 6px) !important;
                                border:1.5px dashed var(--c); color:var(--c); }
  /* 鉛筆假的字母放在白色小圓底上，斜線再密也看得清楚 */
  .seg.pencil b { display:inline-flex; align-items:center; justify-content:center; min-width:16px; height:16px; padding:0 3px;
                  border-radius:999px; background:#fff; box-shadow:0 0 0 1.5px var(--c); font-weight:800; }
  .ini-lg.pencil b { display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px;
                     border-radius:50%; background:#fff; font-weight:800; }

  /* 當天詳情 */
  .dt-row { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); }
  .dt-row:last-child { border-bottom:0; }
  .ini-lg { width:34px; height:34px; border-radius:50%; color:#fff; font-weight:800; font-size:15px; flex-shrink:0;
            display:flex; align-items:center; justify-content:center; border:2px solid transparent; }
  .ini-lg.alt { background:#fff !important; }
  .dt-empty { color:var(--muted); padding:14px 0; text-align:center; }
  .hol-banner { background:#fef2f2; color:var(--bad); border-radius:10px; padding:8px 12px; margin-top:10px; font-weight:600; }

  /* 請假用的臨時月曆（可複選） */
  .pk-nav { display:flex; align-items:center; gap:6px; margin:10px 0 6px; }
  .pk-nav .title { flex:1; font-weight:700; font-size:16px; }
  .pk-nav button { width:34px; height:32px; padding:0; font-size:17px; }
  .pk-grid { display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); gap:4px; touch-action:pan-y; }
  .pk-grid .wd { padding:0 0 2px; }
  .pk { height:44px; border-radius:10px; background:#f3f4f6; display:flex; flex-direction:column; align-items:center; justify-content:center;
        font-weight:600; font-size:14px; cursor:pointer; position:relative; line-height:1.1; }
  .pk small { font-size:9.5px; font-weight:700; color:var(--accent); margin-top:2px; }
  .pk.blank { background:transparent; cursor:default; }
  .pk.off { background:transparent; color:#c4c8cf; cursor:default; }
  .pk.hol { background:transparent; color:#f1a7a7; cursor:default; }
  .pk.full { background:transparent; color:#c4c8cf; cursor:default; text-decoration:line-through; }
  .pk.today { box-shadow:inset 0 0 0 1.5px #9ca3af; }
  .pk.sel { background:#111827; color:#fff; }
  .pk.sel small { color:#fff; }
  .pk.sel::after { content:'✓'; position:absolute; top:2px; right:4px; font-size:10px; font-weight:800; }
  .pk-sum { margin-top:8px; font-size:13px; min-height:18px; }
  .pk-sum b { color:#111827; }
  .legend .ini { display:inline-flex; align-items:center; justify-content:center; width:18px; height:18px; border-radius:50%;
                 color:#fff; font-size:10.5px; font-weight:800; margin-right:4px; vertical-align:-4px; }

  /* 近期清單的日期方塊 */
  .datebox { width:50px; flex-shrink:0; text-align:center; border-radius:10px; background:var(--soft); overflow:hidden; border:1px solid var(--line); }
  .datebox .dm { font-size:11px; color:#fff; padding:2px 0; font-weight:600; }
  .datebox .bar { height:5px; }
  .datebox .dd { padding-top:2px; }

  /* 近期請假：月份小標題 */
  .mon-head { display:flex; justify-content:space-between; align-items:baseline; margin:14px 0 2px; padding:6px 10px;
              background:#f3f4f6; border-radius:8px; font-weight:700; font-size:14px; }
  .sec-head + div .mon-head:first-child, #upcoming > .mon-head:first-child { margin-top:6px; }
  .datebox .dd { font-size:20px; font-weight:700; line-height:1.25; }
  .datebox .dw { font-size:11px; color:var(--muted); padding-bottom:3px; }
  .info { flex:1; min-width:0; }

  .legend { display:flex; gap:6px 12px; flex-wrap:wrap; font-size:12px; color:var(--muted); margin-top:10px; padding-top:10px; border-top:1px solid var(--line); }
  .legend .sep { flex-basis:100%; height:0; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:4px; vertical-align:-1px; }
  .sw { display:inline-block; width:18px; height:10px; border-radius:3px; margin-right:4px; vertical-align:-1px; border:1.5px solid var(--muted); }

  /* 近期清單 */
  .sec-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }
  .item { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); gap:10px; }
  .item:last-child, .item:has(+ .mon-head) { border-bottom:0; }
  .item .who { display:flex; align-items:center; gap:6px; font-weight:600; }
  .item .when { margin-top:2px; }
  .tag { font-size:11px; padding:1px 6px; border-radius:999px; background:#eef2ff; color:var(--accent); font-weight:500; }
  .tag.alt { background:#ecfdf5; color:#047857; }
  .tag.pencil { background:#fff; color:#6b7280; border:1px dashed #9ca3af; }
  .sw.pencil { background:repeating-linear-gradient(135deg, var(--muted) 0 2px, #fff 2px 4px); border-style:dashed; }

  /* 鉛筆假申請通知 */
  #reqCard { display:none; }
  #reqCard.show { display:block; }
  .rq { padding:10px 0; border-bottom:1px solid var(--line); }
  .rq:last-child { border-bottom:0; }
  .rq .rq-txt { font-size:14px; line-height:1.5; }
  .rq .rq-reason { font-size:13px; color:var(--muted); margin-top:2px; }
  .rq .rq-btns { display:flex; gap:8px; margin-top:8px; }
  .rq .rq-btns button { flex:1; padding:9px; font-weight:600; }
  .rq-sec { font-size:12px; font-weight:700; color:var(--muted); margin-top:8px; }
  .rq-sec:first-of-type { margin-top:0; }
  .rq.done { display:flex; align-items:center; gap:8px; }
  .rq.done .rq-txt { flex:1; }
  .x { background:transparent; color:var(--muted); padding:4px 8px; font-size:16px; }
  button.ok { background:#16a34a; color:#fff; }

  .fab { position:fixed; right:16px; bottom:calc(20px + env(safe-area-inset-bottom)); z-index:6;
         border-radius:28px; padding:14px 22px; font-size:16px; font-weight:700;
         box-shadow:0 6px 16px rgba(37,99,235,.35); }

  /* 載入中：月曆變淡、不能再切換月份 */
  .busy { opacity:.35; pointer-events:none; transition:opacity .15s; }
  .mini-spin { display:none; width:14px; height:14px; border:2px solid var(--line); border-top-color:var(--accent);
               border-radius:50%; animation:spin .8s linear infinite; margin-left:8px; vertical-align:-1px; }
  .mini-spin.on { display:inline-block; }
  button.nav-locked { opacity:.4; pointer-events:none; }

  /* 點人名開 LINE */
  a.line-btn { flex-shrink:0; background:#06C755; color:#fff; text-decoration:none; font-weight:800; font-size:13px;
               border-radius:10px; padding:6px 10px; line-height:1.4; }
  .dt-btns { display:flex; gap:6px; flex-shrink:0; align-items:center; }

  button.mini { background:#f3f4f6; color:var(--text); padding:6px 10px; font-size:13px; flex-shrink:0; }
  /* 改假別的選項 */
  .type-opts { display:flex; flex-direction:column; gap:8px; margin-top:14px; }
  .type-opt { display:flex; align-items:center; gap:10px; padding:12px; border-radius:12px; background:#f9fafb;
              border:1.5px solid var(--line); color:var(--text); text-align:left; font-size:15px; }
  .type-opt .sw { width:26px; height:16px; margin:0; }
  .type-opt small { display:block; color:var(--muted); font-size:12px; margin-top:2px; }
  .type-opt.cur { border-color:#111827; background:#fff; }
  .type-opt.cur::after { content:'目前'; margin-left:auto; font-size:12px; color:var(--muted); }

  /* 本月輪值：深藍＋金色的金融風格 */
  #rotCard { display:none; padding:12px 14px 10px; color:#e8edf4; border:1px solid #1d3a5c;
             background:linear-gradient(135deg, #0b1f36 0%, #12304f 60%, #163a5f 100%);
             box-shadow:0 6px 18px rgba(11,31,54,.25); }
  #rotCard.show { display:block; }
  .rot-head { display:flex; justify-content:space-between; align-items:center; padding-bottom:8px; margin-bottom:2px;
              border-bottom:1px solid rgba(201,162,39,.35); }
  .rot-head b { font-size:12px; font-weight:700; letter-spacing:.12em; color:#c9a227; }
  .rot-head b small { font-size:10px; letter-spacing:.18em; color:#8fa3bb; font-weight:600; margin-right:6px; }
  .rot-head .ghost { color:#b8c6d6; padding:2px 4px; font-size:12px; }
  .rot-row { display:flex; align-items:center; gap:8px; padding:8px 6px; margin:0 -6px; font-size:14px; min-width:0;
             border-bottom:1px solid rgba(255,255,255,.07); border-radius:6px; }
  .rot-row:last-child { border-bottom:0; }
  .rot-row .what { color:#8fa3bb; font-size:12.5px; white-space:nowrap; flex-shrink:0; width:7.8em; overflow:hidden; text-overflow:ellipsis; }
  .rot-row .who { display:flex; align-items:center; gap:6px; font-weight:700; color:#fff; min-width:0; white-space:nowrap; letter-spacing:.02em; }
  .rot-row .next { margin-left:auto; font-size:11.5px; color:#8fa3bb; white-space:nowrap; flex-shrink:0; }
  .rot-row .next b { color:#d6dee8; font-weight:600; margin-left:3px; }
  .rot-row.me { background:rgba(201,162,39,.14); box-shadow:inset 3px 0 0 #c9a227; }
  .rot-badge { font-size:10.5px; font-weight:800; letter-spacing:.08em; border-radius:3px; padding:2px 6px;
               background:#c9a227; color:#0b1f36; white-space:nowrap; flex-shrink:0; }
  .rot-badge.soon { margin-left:auto; background:transparent; color:#e6c65c; border:1px solid rgba(201,162,39,.6); }
  .ini-sm { width:20px; height:20px; border-radius:50%; color:#fff; font-size:10px; font-weight:800; flex-shrink:0;
            display:inline-flex; align-items:center; justify-content:center; letter-spacing:0; }
  #rotCard .ini-sm { box-shadow:0 0 0 1.5px rgba(255,255,255,.85); }
  .rot-tbl { width:100%; border-collapse:collapse; font-size:12.5px; margin-top:10px; font-variant-numeric:tabular-nums; }
  .rot-tbl th, .rot-tbl td { padding:7px 4px; border-bottom:1px solid rgba(255,255,255,.08); text-align:left; }
  .rot-tbl th { color:#c9a227; font-weight:700; font-size:11px; letter-spacing:.1em; border-bottom:1px solid rgba(201,162,39,.35); }
  .rot-tbl td { color:#d6dee8; }
  .rot-tbl td:first-child { color:#8fa3bb; }
  .rot-tbl tr.cur td { color:#fff; font-weight:700; }
  .rot-tbl td.mine { color:#e6c65c; font-weight:800; }

  /* 下拉重新整理的提示 */
  #ptr { height:0; overflow:hidden; display:flex; align-items:center; justify-content:center; gap:8px;
         color:var(--muted); font-size:13px; }
  #ptr i { width:16px; height:16px; border:2px solid var(--line); border-top-color:var(--muted); border-radius:50%;
           transition:transform .15s; }
  #ptr.ready i { transform:rotate(180deg); border-top-color:var(--accent); }
  #ptr.ready span { color:var(--accent); }
  #ptr.spin i { border-top-color:var(--accent); animation:spin .8s linear infinite; }
  /* 觸控手機用下拉；電腦沒有觸控，保留「重新整理」按鈕 */
  @media (hover:none) and (pointer:coarse) { .refresh-btn { display:none; } }

  /* 月曆左右滑動切換 */
  #cal { touch-action:pan-y; }
  #cal.slide-l { animation:slideL .22s ease-out; }
  #cal.slide-r { animation:slideR .22s ease-out; }
  @keyframes slideL { from { opacity:0; transform:translateX(24px); } to { opacity:1; transform:none; } }
  @keyframes slideR { from { opacity:0; transform:translateX(-24px); } to { opacity:1; transform:none; } }

  /* 彈出視窗 */
  .mask { position:fixed; inset:0; background:rgba(0,0,0,.4); display:none; align-items:flex-end; justify-content:center; z-index:10; }
  .mask.show { display:flex; }
  .sheet { background:#fff; width:100%; max-width:520px; border-radius:18px 18px 0 0; padding:18px 16px calc(18px + env(safe-area-inset-bottom));
           max-height:92vh; overflow:auto; box-shadow:0 -6px 24px rgba(0,0,0,.15); }
  label { display:block; font-size:13px; color:var(--muted); margin:12px 0 4px; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .err { background:#fee2e2; color:var(--bad); border-radius:8px; padding:8px 10px; margin-top:10px; font-size:13px; display:none; white-space:pre-line; }
  .actions { display:flex; gap:8px; margin-top:16px; }
  .actions button { flex:1; padding:12px; }
  .toast { position:fixed; left:50%; top:16px; transform:translateX(-50%); background:#111827; color:#fff; padding:10px 16px; border-radius:10px; display:none; z-index:30; max-width:90vw; }
  .loading { text-align:center; color:var(--muted); padding:20px; }

  #loginView { display:none; min-height:100vh; align-items:center; justify-content:center; padding:16px; }
  #loginView .card { width:100%; max-width:360px; padding:22px; }
  #pinIn { font-size:22px; letter-spacing:8px; text-align:center; }
  #appView { display:none; }
  header { padding-top:calc(10px + env(safe-area-inset-top)); }
  #bootView { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; color:var(--muted); padding:24px; text-align:center; }
  .spinner { width:32px; height:32px; border:3px solid var(--line); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* ================= 主題：深藍＋金・米白紙感（金融風） ================= */

:root { --bg:#eef1f5; --card:#fff; --text:#0b1f36; --muted:#64748b; --line:#e2e8f0; --accent:#12304f; --soft:#f6f8fb; --gold:#b8921f; }
body { font-feature-settings:"tnum"; }
header { background:linear-gradient(135deg,#0b1f36,#163a5f) !important; border-bottom:2px solid #c9a227 !important; }
header h1 { color:#fff; letter-spacing:.08em; }
header h1 .gold, #loginView h2 .gold { color:#c9a227; }

/* 內容區：米白紙感 */
:root { --bg:#ecebe6; --soft:#fbfaf6; --line:#e7e2d6; }
.card:not(#rotCard) { background:#fdfcf8; border-color:#e9e3d3; }
.nav { padding-bottom:8px; border-bottom:1px solid rgba(184,146,31,.35); margin-bottom:10px; }
.nav button { background:#fff; border-color:#e6dfcc; }
.day { background:#f6f3ea; }
.day.weekend, .day.empty { background:transparent; }
.day.full { background:#f3ead0; }
.stripe { background:none !important; box-shadow:inset 0 0 0 1px rgba(11,31,54,.06) !important; background-color:rgba(255,255,255,.7) !important; }
.wd { color:#8a7a52; }
.legend { border-top-color:#e9e3d3; }
.mon-head { background:#12304f; }
.item { border-bottom-color:#ece6d6; }
.datebox { background:#fff; border-color:#e6dfcc; }

.pk.today { box-shadow:inset 0 0 0 1.5px #c9a227; }

#ptr.ready i, #ptr.spin i { border-top-color:#c9a227; }
#ptr.ready span { color:#8a6d12; }

  /* 設定：主題選擇 */
  .th-opts { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:8px; }
  .th-opt { border:2px solid var(--line); border-radius:12px; padding:6px; background:transparent; color:var(--text); font-size:13px; font-weight:600; }
  .th-opt.cur { border-color:#c9a227; }
  .th-prev { height:58px; border-radius:8px; overflow:hidden; display:flex; flex-direction:column; margin-bottom:6px; border:1px solid rgba(0,0,0,.06); }
  .th-prev i { display:block; }
  .set-sec { font-size:12px; font-weight:700; color:var(--muted); margin:16px 0 4px; letter-spacing:.06em; }

<script>
/* ====== 設定：貼上 Apps Script 部署後的「網頁應用程式網址」（結尾是 /exec） ====== */
const API_URL = 'https://script.google.com/macros/s/AKfycbznum_5tyCbBKmoigxujp26vkuMPcJiPj8ke9_6byY5gajVrqjuwVzwp150QnVbvEHd/exec';
/* ============================================================================= */

let FORCE = false, FORCE_OLD = '';
let ADMIN = false;   // 管理員模式（登入時輸入管理員 PIN）
let CONTACTS = {};   // 各人的 LINE 連結（登入後才從後端拿）
/** 鉛筆假旁邊的 LINE 按鈕：先私訊對方商量，再送出讓假申請 */
function lineBtn(n){
  const url = CONTACTS[n];
  if (!url || n===NAME) return '';
  return `<a class="line-btn" href="${esc(lineAppUrl(url))}">LINE</a>`;
}
/** 轉成 line.me/R/ 格式：iPhone 會直接交給 LINE App 開，不跳確認、也不會出現 line.me 中繼頁 */
function lineAppUrl(url){
  const m = String(url).match(/\/ti\/p\/([^/?#]+)/);
  return m ? 'https://line.me/R/ti/p/' + m[1] : url;
}
let INIT = null, TOKEN = '', NAME = '', cur = { y:0, m:0 }, monthLeaves = [], upcoming = [], colorOf = {};
const initialOf = {};
const WD = '日一二三四五六';

const $ = id => document.getElementById(id);
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function pad(n){ return (n<10?'0':'')+n; }
function ymd(y,m,d){ return y+'-'+pad(m)+'-'+pad(d); }
function daysIn(y,m){ return new Date(y,m,0).getDate(); }
function parts(s){ return s.split('-').map(Number); }
function wdIdx(s){ const [y,m,d]=parts(s); return new Date(Date.UTC(y,m-1,d)).getUTCDay(); }
function addDays(s,n){ const [y,m,d]=parts(s); const t=new Date(Date.UTC(y,m-1,d+n)); return ymd(t.getUTCFullYear(),t.getUTCMonth()+1,t.getUTCDate()); }
function shortDate(s){ const [y,m,d]=parts(s); return (y!==parts(INIT.today)[0]?y+'/':'')+m+'/'+d+'（'+WD[wdIdx(s)]+'）'; }
function toast(msg){ const t=$('toast'); t.textContent=msg; t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none',2500); }
function store(k,v){ try{ v ? localStorage.setItem(k,v) : localStorage.removeItem(k); }catch(e){} }
function load(k){ try{ return localStorage.getItem(k)||''; }catch(e){ return ''; } }
function showErr(id,msg){ const e=$(id); e.textContent=msg; e.style.display=msg?'block':'none'; }
function closeMask(id){ $(id).classList.remove('show'); }
function openMask(id){ $(id).classList.add('show'); }
function holiday(ds){ return (INIT.holidays||{})[ds]; }
function isOff(ds){
  const h = holiday(ds), w = wdIdx(ds);
  if (h && h.type==='放假') return true;
  if (h && h.type==='補班') return false;
  return INIT.skipWeekends && (w===0||w===6);
}
function nextWorkday(ds){ let d=addDays(ds,1), i=0; while(isOff(d) && i++<30) d=addDays(d,1); return d; }
const PENCIL = '鉛筆假';
function isPencil(type){ return type===PENCIL; }
function isAlt(type){ return !isPencil(type) && INIT.types.indexOf(type) > 0; }   // 代理OP：空心
/** 假別樣式：休假實心、代理OP 空心、鉛筆假斜線 */
function typeCls(type){ return isPencil(type) ? 'pencil' : isAlt(type) ? 'alt' : ''; }
function typeStyle(type, c){
  if (isPencil(type)) return `--c:${c}`;
  if (isAlt(type)) return `border-color:${c};color:${c}`;
  return `background:${c}`;
}

/** 呼叫 Apps Script API。用 text/plain 送出，瀏覽器不會先發 CORS 預檢請求 */
async function call(fn,...args){
  let res;
  try {
    res = await fetch(API_URL, {
      method:'POST',
      headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify({ fn, args }),
    });
  } catch(e) {
    throw new Error('連不上伺服器，請檢查網路後再試一次');
  }
  let j;
  try { j = await res.json(); }
  catch(e) { throw new Error('伺服器回應格式不正確（請確認 API 網址與部署權限）'); }
  if (!j.ok) throw new Error(j.error || '伺服器錯誤');
  return j.data;
}
function api(fn,...args){
  return call(fn, TOKEN, ...args).catch(e=>{
    const m = String(e.message||e);
    if (m.indexOf('MUSTCHANGE')>=0 && !ADMIN){ openPin(true, ''); e = new Error('請先設定新的 PIN'); }
    else if (m.indexOf('AUTH')>=0){ logout(); toast('登入已失效，請重新登入'); }
    throw e;
  });
}

/* ---------- 初始化 / 登入 ---------- */

call('getInitData').then(d=>{
  INIT = d;
  if (!(INIT.slotLimit > 0)) INIT.slotLimit = 1;   // 後端還沒更新時的預設值：每個時段 1 人
  d.staff.forEach(s=>colorOf[s.name]=s.color);
  // 名字縮寫：預設第一個字母；如果有人撞同一個字母，就改用前兩個字
  d.staff.forEach(s=>{
    const one = s.name.charAt(0).toUpperCase();
    const clash = d.staff.some(o=>o.name!==s.name && o.name.charAt(0).toUpperCase()===one);
    initialOf[s.name] = clash ? s.name.slice(0,2) : one;
  });
  $('loginName').innerHTML = '<option value="">（選擇）</option>' + d.staff.map(s=>`<option>${esc(s.name)}</option>`).join('');
  $('fType').innerHTML = d.types.map(t=>`<option>${esc(t)}</option>`).join('');
  $('fWho').innerHTML = d.staff.map(s=>`<option>${esc(s.name)}</option>`).join('');
  $('legend').innerHTML =
    d.staff.map(s=>`<span><span class="ini" style="background:${s.color}">${esc(initialOf[s.name])}</span>${esc(s.name)}</span>`).join('') +
    '<span class="sep"></span>' +
    d.types.map((t,i)=>`<span><span class="sw ${t===PENCIL?'pencil':''}" style="${i?'':'background:var(--muted)'}"></span>${esc(t)}</span>`).join('') +
    `<span>・每個時段限 ${d.slotLimit} 人（休假、代理OP 合併計算）</span>`;
  const t = parts(d.today); cur = { y:t[0], m:t[1] };

  TOKEN = load('leave_token'); NAME = load('leave_name'); ADMIN = load('leave_admin')==='1';
  if (ADMIN) NAME = '管理員';
  $('bootView').style.display='none';
  TOKEN && NAME ? showApp() : showLogin();
}).catch(e=>{
  $('bootView').querySelector('.spinner').style.display='none';
  $('bootMsg').innerHTML = `載入失敗：${esc(e.message)}<br><br><button class="primary" onclick="location.reload()">重新載入</button>`;
});

function showLogin(){

/* 手機上 App 一直開著、隔天再切回來時：更新「今天」與最新假單，避免日期停在前一天 */

/* ---------- 下拉重新整理 ----------
 * 在頁面最上方往下拉 → 放開就更新資料（不重新載入整個網頁，所以比較快）。
 * 加到主畫面的 App 原本沒有下拉重整，這裡自己做一個。 */
(function(){
  const ind = $('ptr'), TRIGGER = 64;
  let y0 = null, x0 = 0, pull = 0, busy = false;
  const anyMask = () => !!document.querySelector('.mask.show');
  const set = (h, txt, spin) => {
    ind.style.height = h + 'px';
    ind.querySelector('span').textContent = txt;
    ind.classList.toggle('spin', !!spin);
    ind.classList.toggle('ready', h >= TRIGGER && !spin);
  };
  document.addEventListener('touchstart', e=>{
    if (busy || anyMask() || $('appView').style.display==='none' || window.scrollY > 0) { y0 = null; return; }
    y0 = e.touches[0].clientY; x0 = e.touches[0].clientX; pull = 0;
  }, { passive:true });
  document.addEventListener('touchmove', e=>{
    if (y0 === null) return;
    const dy = e.touches[0].clientY - y0, dx = Math.abs(e.touches[0].clientX - x0);
    if (dy <= 0 || dx > dy) { if (pull) set(0,''); pull = 0; return; }   // 往上滑、或其實是左右滑月曆 → 不算
    pull = Math.min(dy * 0.5, 96);
    ind.style.transition = 'none';
    set(pull, pull >= TRIGGER ? '放開更新' : '下拉重新整理');
  }, { passive:true });
  document.addEventListener('touchend', ()=>{
    if (y0 === null) return;
    y0 = null;
    ind.style.transition = 'height .2s';
    if (pull < TRIGGER) { set(0,''); pull = 0; return; }
    busy = true; set(48, '更新中…', true);
    Promise.resolve(refresh()).finally(()=>{ busy = false; pull = 0; set(0,''); });
  }, { passive:true });
})();

/** 按下去立刻有反應：按鈕變「處理中…」並鎖住，避免以為沒按到又按一次 */
function busyBtn(btn, on, text){
  if (!btn) return;
  const box = btn.closest('.rq, .dt-row, .item') || btn.parentNode;
  box.querySelectorAll('button').forEach(b=>{ b.disabled = on; });
  if (on) { btn._h = btn.innerHTML; btn.textContent = text || '處理中…'; }
  else if (btn._h !== undefined) btn.innerHTML = btn._h;      // 還原原本的內容（包含樣式）
}
/* 載入中鎖定：資料還沒回來前，不能再滑動或按箭頭切換月份 */
const BUSY = { main:false, pk:false };
function setBusy(which, on){
  BUSY[which] = on;
  const grid = which==='main' ? $('cal') : $('pkGrid');
  grid.classList.toggle('busy', on);
  $(which==='main' ? 'calSpin' : 'pkSpin').classList.toggle('on', on);
  const box = grid.closest(which==='main' ? '.card' : '.sheet');
  box.querySelectorAll(which==='main' ? '.nav button' : '.pk-nav button').forEach(b=>b.classList.toggle('nav-locked', on));
}
/** 先在背景抓前後一個月，之後滑過去就不用等 */
function prefetchAround(y,m){
  [-1,1].forEach(n=>{ let yy=y, mm=m+n; if(mm<1){mm=12;yy--;} if(mm>12){mm=1;yy++;} fetchMonth(yy,mm).catch(()=>{}); });
}

function shiftMonth(n){
  if (BUSY.main) return;
  cur.m+=n; if(cur.m<1){cur.m=12;cur.y--;} if(cur.m>12){cur.m=1;cur.y++;}
  const cal=$('cal'); cal.classList.remove('slide-l','slide-r'); void cal.offsetWidth;
  cal.classList.add(n>0?'slide-l':'slide-r');
  loadMonth();
}

/* 左右滑切換月份：往左滑 = 下個月，往右滑 = 上個月（主月曆、請假月曆共用） */
function onSwipe(el, fn){
  let x0=null, y0=null;
  el.addEventListener('touchstart', e=>{ const t=e.touches[0]; x0=t.clientX; y0=t.clientY; }, { passive:true });
  el.addEventListener('touchend', e=>{
    if (x0===null) return;
    const t=e.changedTouches[0], dx=t.clientX-x0, dy=t.clientY-y0;
    x0=y0=null;
    if (Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)*1.5) fn(dx<0?1:-1);
  }, { passive:true });
}
onSwipe($('cal'), shiftMonth);
function goToday(){ if (BUSY.main) return; const t=parts(INIT.today); cur={ y:t[0], m:t[1] }; loadMonth(); }

/* ---------- 選年月：點月份標題跳出，一次跳到任何年月 ---------- */

function openYM(target){

function loadMonth(){
  $('monthTitle').textContent = `${cur.y} 年 ${cur.m} 月`;
  const y=cur.y, m=cur.m, cached = monthCache[mkey(y,m)];
  if (cached) {                                   // 已經抓過：馬上顯示，背景再更新一次
    monthLeaves = cached; renderCal();
    fetchMonth(y,m,true).then(r=>{ if (y===cur.y && m===cur.m) { monthLeaves=r; renderCal(); } }).catch(()=>{});
    prefetchAround(y,m);
    return;
  }
  monthLeaves = []; renderCal();                  // 沒抓過：先畫空月曆並鎖住，等資料回來
  setBusy('main', true);
  fetchMonth(y,m)
    .then(r=>{ if (y===cur.y && m===cur.m) { monthLeaves=r; renderCal(); } prefetchAround(y,m); })
    .catch(e=>toast(e.message))
    .finally(()=>setBusy('main', false));

/* 各月份假單快取（主月曆、請假月曆、當天詳情共用） */
const monthCache = {};
function mkey(y,m){ return y+'-'+pad(m); }
const pending = {};   // 正在抓的月份，避免同一個月重複送出請求
function fetchMonth(y,m,force){
  const k = mkey(y,m);
  if (!force && monthCache[k]) return Promise.resolve(monthCache[k]);
  if (!force && pending[k]) return pending[k];
  const p = api('getLeaves', ymd(y,m,1), ymd(y,m,daysIn(y,m)))
    .then(r=>{ monthCache[k]=r; return r; })
    .finally(()=>{ if (pending[k]===p) delete pending[k]; });
  pending[k] = p;
  return p;
}
/** 某天所有人的假 */
function leavesOn(ds){
  const [y,m] = parts(ds), seen = {}, out = [];
  (monthCache[mkey(y,m)]||[]).concat(upcoming).forEach(l=>{ if (l.date===ds && !seen[l.id]) { seen[l.id]=1; out.push(l); } });
  return out;
}

/* 名額以時段計算：全天 = 上午＋下午；休假、代理OP 共用名額 */
function slotsOf(slot){ return slot==='上午' ? ['上午'] : slot==='下午' ? ['下午'] : ['上午','下午']; }
function covers(list, s){ return list.filter(l=>slotsOf(l.slot).indexOf(s)>=0); }
/** 我這天還能請的時段：有名額、而且我自己還沒登記 */
/** 這次是幫誰請假：一般人是自己；管理員是表單上選的人 */
function who(){ return ADMIN ? $('fWho').value : NAME; }
function availSlots(list, person){
  person = person || who();
  return ['上午','下午'].filter(s => covers(list,s).length < INIT.slotLimit && !covers(list,s).some(l=>l.name===person));
}
/** 這天還有沒有任何空位（不管是誰） */
function anyFree(list){ return ['上午','下午'].filter(s => covers(list,s).length < INIT.slotLimit); }

/* ---------- 主月曆（只看，不選） ---------- */

function renderCal(){
  const byDate = {};
  monthLeaves.forEach(l=>(byDate[l.date]=byDate[l.date]||[]).push(l));
  let html = WD.split('').map((w,i)=>`<div class="wd ${i===0||i===6?'we':''}">${w}</div>`).join('');
  const lead = new Date(cur.y,cur.m-1,1).getDay();
  for (let i=0;i<lead;i++) html += '<div class="day empty"></div>';
  for (let d=1; d<=daysIn(cur.y,cur.m); d++){
    const ds=ymd(cur.y,cur.m,d), list=byDate[ds]||[], wd=(lead+d-1)%7, cls=['day'];
    const h = holiday(ds);
    if (h && h.type==='放假') cls.push('holiday');
    else if ((wd===0||wd===6) && !(h && h.type==='補班')) cls.push('weekend');
    if (ds<INIT.today) cls.push('past');
    if (ds===INIT.today) cls.push('today');
    if (covers(list,'上午').length>=INIT.slotLimit && covers(list,'下午').length>=INIT.slotLimit) cls.push('full');
    const hTag = h ? `<span class="hname ${h.type==='補班'?'work':''}">${esc(h.type==='補班'?'補班':h.name)}</span>` : '';
    const slotsHtml = (!isOff(ds) || list.length) ? renderSlots(list) : '';
    html += `<div class="${cls.join(' ')}" onclick="openDay('${ds}')"><div class="num">${d}</div>${hTag}${slotsHtml}</div>`;
  }
  $('cal').innerHTML = html;
}

/** 平常一整格；有人只請半天時才分上（上午）下（下午）兩格 */
function renderSlots(list){
  const seg = l => {
    const c = colorOf[l.name]||'#666';
    const ini = esc(initialOf[l.name]||l.name.charAt(0));
    return `<span class="seg ${typeCls(l.type)}" style="${typeStyle(l.type,c)}">${isPencil(l.type)?`<b>${ini}</b>`:ini}</span>`;
  };
  const am = covers(list,'上午'), pm = covers(list,'下午');
  if (!am.length && !pm.length) return '<div class="slots"><div class="stripe"></div></div>';
  const sameNames = (a,b) => a.length===b.length && a.every(x=>b.some(y=>y.name===x.name && y.type===x.type));
  if (sameNames(am,pm)) return '<div class="slots"><div class="row">' + am.map(seg).join('') + '</div></div>';
  const row = arr => '<div class="row">' + (arr.length ? arr.map(seg).join('') : '<div class="stripe"></div>') + '</div>';
  return '<div class="slots">' + row(am) + row(pm) + '</div>';
}

/* ---------- 點日期：當天詳情 ---------- */

let DAY = '';
function openDay(ds){
  DAY = ds;
  const h = holiday(ds), list = leavesOn(ds);
  $('dTitle').textContent = shortDate(ds);

  // 同一人同假別的上午＋下午合併成全天
  const rows = [], used = new Set();
  list.forEach(l=>{
    if (used.has(l)) return;
    const pair = l.slot!=='全天' ? list.find(x=>x!==l && !used.has(x) && x.name===l.name && x.type===l.type && x.slot!=='全天' && x.slot!==l.slot) : null;
    used.add(l); if (pair) used.add(pair);
    const parts = pair ? [{id:l.id, slot:l.slot}, {id:pair.id, slot:pair.slot}] : [{id:l.id, slot:l.slot}];
    rows.push({ name:l.name, type:l.type, slot: pair ? '全天' : l.slot, reason: l.reason || (pair && pair.reason) || '', ids: parts.map(x=>x.id), parts });
  });
  const order = { '全天':0, '上午':1, '下午':2 };
  rows.sort((a,b)=>order[a.slot]-order[b.slot]);

  let body = h ? `<div class="hol-banner">${esc(h.type==='補班' ? '補班日' : h.name)}</div>` : '';
  if (!rows.length) body += `<div class="dt-empty">${isOff(ds) ? '' : '這天沒有人請假'}</div>`;
  body += rows.map((r,i)=>{
    const c = colorOf[r.name]||'#666';

    // 別人的鉛筆假：可以申請讓給我（已經申請過就顯示等待中）
    let askBtn = '';
    if (isPencil(r.type) && !ADMIN && r.name!==NAME && ds>=INIT.today) {

               (waiting ? `<span class="muted">已申請・等回覆</span>`
                        : `<button class="primary" style="padding:6px 10px;font-size:13px" onclick="openAsk(${i})">請她讓給我</button>`) + `</div>`;
    }
    return `<div class="dt-row">
      <span class="ini-lg ${typeCls(r.type)}" style="${typeStyle(r.type,c)}">${isPencil(r.type)?`<b>${esc(initialOf[r.name]||r.name.charAt(0))}</b>`:esc(initialOf[r.name]||r.name.charAt(0))}</span>
      <div class="info">
        <div class="who" style="display:flex;gap:6px;align-items:center;font-weight:600">${esc(r.name)}<span class="tag ${typeCls(r.type)}">${esc(r.type)}</span></div>
        <div class="muted">${esc(r.slot)}${r.reason?'・'+esc(r.reason):''}</div>
      </div>
      ${canCancel?`<div class="dt-btns"><button class="mini" onclick="openType('day',${i})">改假別</button><button class="danger" onclick="cancelDayRow(${i},this)">取消</button></div>`:askBtn}
    </div>`;
  }).join('');
  $('dBody').innerHTML = body;

  const free = isOff(ds) ? [] : ADMIN ? anyFree(list) : (ds>=INIT.today ? availSlots(list, NAME) : []);
  $('dActions').innerHTML = `<button onclick="closeMask('dayMask')">關閉</button>` +
    (free.length ? `<button class="primary" onclick="closeMask('dayMask');openForm('${ds}')">請這天${free.length===1?'（'+free[0]+'）':''}</button>` : '');
  openMask('dayMask');
}
function cancelDayRow(i, btn){
  const r = openDay._rows[i];
  if (!confirm(`確定取消 ${shortDate(DAY)} ${r.slot}的${r.type}？`)) return;
  busyBtn(btn, true, '取消中…');
  api('cancelLeave', r.ids).then(()=>{ toast('已取消'); closeMask('dayMask'); invalidate(); refresh(); })
    .catch(e=>{ busyBtn(btn, false); toast(e.message); });
}
function invalidate(){ Object.keys(monthCache).forEach(k=>delete monthCache[k]); }

/* ---------- 近期清單：連續上班日合併成一段 ---------- */

function loadUpcoming(){
  api('getLeaves', INIT.today, addDays(INIT.today,90)).then(r=>{ upcoming=r; renderUpcoming(); }).catch(e=>toast(e.message));
}

function groupLeaves(list){
  const byDay = {}, merged = [];
  list.forEach(l=>{ const k = l.name+'|'+l.type+'|'+l.date; (byDay[k]=byDay[k]||[]).push(l); });
  Object.keys(byDay).forEach(k=>{
    const arr = byDay[k];
    const am = arr.find(l=>l.slot==='上午'), pm = arr.find(l=>l.slot==='下午');
    if (am && pm) {
      merged.push(Object.assign({}, am, { slot:'全天', ids:[am.id, pm.id], reason: am.reason || pm.reason }));
      arr.filter(l=>l!==am && l!==pm).forEach(l=>merged.push(Object.assign({}, l, { ids:[l.id] })));
    } else {
      arr.forEach(l=>merged.push(Object.assign({}, l, { ids:[l.id] })));
    }
  });
  const sorted = merged.sort((a,b)=> a.name.localeCompare(b.name) || a.type.localeCompare(b.type) || a.date.localeCompare(b.date));
  const groups = [];
  sorted.forEach(l=>{
    const g = groups[groups.length-1];
    if (g && g.name===l.name && g.type===l.type && g.slot===l.slot && g.reason===l.reason && nextWorkday(g.end)===l.date){
      g.end = l.date; g.ids.push(...l.ids); g.days++;
    } else {
      groups.push({ name:l.name, type:l.type, slot:l.slot, reason:l.reason, start:l.date, end:l.date, ids:l.ids.slice(), days:1 });
    }
  });
  return groups.sort((a,b)=>a.start.localeCompare(b.start));
}

function renderUpcoming(){
  const box=$('upcoming'); box.className='';
  const groups = groupLeaves(upcoming);
  renderUpcoming._groups = groups;
  if(!groups.length){ box.innerHTML='<div class="muted" style="padding:8px 0">接下來 90 天沒有人請假</div>'; return; }
  // 依「開始日的月份」分組，每個月一個小標題
  let html = '', lastKey = '';
  groups.forEach((g,i)=>{
    const [gy, gm, gd] = parts(g.start);
    const key = gy+'-'+gm;
    if (key !== lastKey) {
      const count = groups.filter(x=>{ const [yy,mm]=parts(x.start); return yy===gy && mm===gm; }).length;
      html += `<div class="mon-head"><span>${gy!==parts(INIT.today)[0]?gy+' 年 ':''}${gm} 月</span><span class="muted">${count} 筆</span></div>`;
      lastKey = key;
    }
    const c = colorOf[g.name]||'#666';
    const when = g.start===g.end ? g.slot : `到 ${shortDate(g.end)}・共 ${g.days} 天${g.slot!=='全天'?'（'+g.slot+'）':''}`;
    html += `
    <div class="item">
      <div class="datebox"><div class="bar" style="background:${c}"></div><div class="dd">${gd}</div><div class="dw">週${WD[wdIdx(g.start)]}</div></div>
      <div class="info">
        <div class="who">${esc(g.name)}<span class="tag ${typeCls(g.type)}">${esc(g.type)}</span></div>
        <div class="when muted">${esc(when)}</div>
        ${g.reason?`<div class="muted" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(g.reason)}</div>`:''}
      </div>
      ${(ADMIN || g.name===NAME)?`<button class="danger" onclick="cancelGroup(${i},this)">取消</button>`:''}
    </div>`;
  });
  box.innerHTML = html;
}

function cancelGroup(i, btn){
  const g = renderUpcoming._groups[i];
  const range = g.start===g.end ? shortDate(g.start) : `${shortDate(g.start)} – ${shortDate(g.end)}（${g.days} 天）`;
  if(!confirm(`確定取消 ${range} 的${g.type}？`)) return;
  busyBtn(btn, true, '取消中…');
  api('cancelLeave', g.ids).then(r=>{ toast(`已取消 ${r.count} 天`); invalidate(); refresh(); })
    .catch(e=>{ busyBtn(btn, false); toast(e.message); });
}

/* ---------- 請假：臨時月曆可複選（可以跨月份） ---------- */

const PK = { y:0, m:0, sel:new Set() };

function openForm(ds){
  PK.sel.clear();
  if (ds) PK.sel.add(ds);
  const base = ds ? parts(ds) : [cur.y, cur.m];
  PK.y = base[0]; PK.m = base[1];
  $('formName').textContent = NAME;
  $('formWhoLine').style.display = ADMIN ? 'none' : '';
  $('formWhoPick').style.display = ADMIN ? '' : 'none';
  if (ADMIN && ds) {                                 // 從某天點進來：預選那天還能請的第一個人
    const list = leavesOn(ds);
    const names = INIT.staff.map(s=>s.name);
    const ok = names.find(n=>!list.some(l=>l.name===n) && availSlots(list, n).length)   // 優先選這天完全沒登記的人
            || names.find(n=>availSlots(list, n).length);
    if (ok) $('fWho').value = ok;
  }
  $('fType').value = INIT.types[0];
  $('fSlot').value = '全天'; PK.slotTouched = false;
  $('fReason').value=''; showErr('fErr','');
  pkLoad();
  openMask('formMask');
}
function pkShift(n){
  if (BUSY.pk) return;
  PK.m+=n; if(PK.m<1){PK.m=12;PK.y--;} if(PK.m>12){PK.m=1;PK.y++;}
  pkLoad();
}
onSwipe($('pkGrid'), pkShift);
$('fSlot').addEventListener('change', ()=>{ PK.slotTouched = true; });

function pkLoad(){
  $('pkTitle').textContent = `${PK.y} 年 ${PK.m} 月`;
  const y=PK.y, m=PK.m;
  pkRender();
  if (monthCache[mkey(y,m)]) { prefetchAround(y,m); return; }   // 已經有資料：直接可以選
  setBusy('pk', true);                                           // 沒有資料：鎖住，等載入完才能點、才能再切換
  fetchMonth(y,m)
    .then(()=>{ if (y===PK.y && m===PK.m) pkRender(); prefetchAround(y,m); })
    .catch(e=>toast(e.message))
    .finally(()=>setBusy('pk', false));
}

function pkRender(){
  let html = WD.split('').map((w,i)=>`<div class="wd ${i===0||i===6?'we':''}">${w}</div>`).join('');
  const lead = new Date(PK.y,PK.m-1,1).getDay();
  for (let i=0;i<lead;i++) html += '<div class="pk blank"></div>';
  for (let d=1; d<=daysIn(PK.y,PK.m); d++){
    const ds = ymd(PK.y,PK.m,d), h = holiday(ds), cls = ['pk'];
    let sub = '';
    if (ds < INIT.today && !ADMIN) cls.push('off');
    else if (h && h.type==='放假') cls.push('hol');
    else if (isOff(ds)) cls.push('off');
    else {
      const free = availSlots(leavesOn(ds));
      if (!free.length) cls.push('full');
      else if (free.length===1) sub = `<small>${free[0]}</small>`;
    }
    if (ds===INIT.today) cls.push('today');
    if (PK.sel.has(ds)) cls.push('sel');
    html += `<div class="${cls.join(' ')}" onclick="pkTap('${ds}')">${d}${sub}</div>`;
  }
  $('pkGrid').innerHTML = html;
  pkSummary();
}

function pkTap(ds){
  if (PK.sel.has(ds)) { PK.sel.delete(ds); return pkRender(); }
  const h = holiday(ds);
  if (ds < INIT.today && !ADMIN) return;
  if (h && h.type==='放假') return toast(`${shortDate(ds)} ${h.name}`);
  if (isOff(ds)) return;
  const list = leavesOn(ds), free = availSlots(list);
  if (!free.length) {
    const hasPencil = list.some(l=>isPencil(l.type) && l.name!==who());
    return toast(`${shortDate(ds)} 已滿：` + list.map(l=>`${l.name}（${l.slot}${l.type}）`).join('、') +
                 (hasPencil && !ADMIN ? '。鉛筆假可以在月曆點這天，請她讓給你' : ''));
  }
  PK.sel.add(ds);
  pkRender();
}

/** 已選日期的摘要，並把時段預設成每一天都能請的時段 */
function pkSummary(){
  const dates = [...PK.sel].sort();
  if (!dates.length) { $('pkSum').innerHTML = '還沒選日期'; return; }
  let common = ['上午','下午'];
  dates.forEach(d=>{ const f = availSlots(leavesOn(d)); common = common.filter(s=>f.indexOf(s)>=0); });
  let note = '';
  if (common.length===2) { if (!PK.slotTouched) $('fSlot').value = '全天'; }
  else if (common.length===1) { $('fSlot').value = common[0]; note = `・只剩${common[0]}可請`; }
  else note = '・選的日期可請時段不同，請分開送出';
  $('pkSum').innerHTML = `已選 <b>${dates.length}</b> 天：${esc(dates.map(shortDate).join('、'))}${note}`;
}

function submitForm(){
  const dates = [...PK.sel].sort();
  showErr('fErr','');
  if (!dates.length) return showErr('fErr','請先在月曆上點選日期');
  const p = { type:$('fType').value, slot:$('fSlot').value, reason:$('fReason').value.trim(), dates };
  if (ADMIN) p.forName = $('fWho').value;
  const btn=$('fSubmit'); btn.disabled=true; btn.textContent='送出中…';
  api('submitLeave', p).then(r=>{
    invalidate();
    if(!r.ok){ showErr('fErr','無法送出：\n'+r.conflicts.join('\n')); refresh(); fetchMonth(PK.y,PK.m,true).then(pkRender); return; }
    closeMask('formMask'); PK.sel.clear(); toast(`已登記 ${r.dates.length} 天`); refresh();
  }).catch(e=>showErr('fErr',e.message)).finally(()=>{ btn.disabled=false; btn.textContent='送出'; });
}

/* ---------- 本月輪值 ----------
 * 設定在 Code.gs 的 ROTATIONS：從 start 月份開始，照 order 每人一個月輪下去。 */

/** 某個月輪到誰 */
function rotWho(rot, y, m){
  const [sy, sm] = rot.start.split('-').map(Number);
  const n = rot.order.length, k = (y*12+m) - (sy*12+sm);
  return rot.order[((k % n) + n) % n];
}
function addMonth(y, m, d){ m += d; while (m>12){ m-=12; y++; } while (m<1){ m+=12; y--; } return [y, m]; }
function personChip(n){
  const c = colorOf[n] || '#9ca3af';
  const ini = initialOf[n] || n.replace(/^EBC-CS/,'C').slice(0,2);   // EBC-CS2 → C2
  return `<span class="ini-sm" style="background:${c}">${esc(ini)}</span>${esc(n)}`;
}

function renderRotation(){
  const rots = (INIT && INIT.rotations) || [];
  $('rotCard').classList.toggle('show', rots.length > 0);
  if (!rots.length) return;
  const [ty, tm, td] = parts(INIT.today);
  const [ny, nm] = addMonth(ty, tm, 1);
  const lastWeek = td > daysIn(ty, tm) - 7;          // 月底最後一週，提醒下個月換誰
  $('rotTitle').innerHTML = `<small>ROTATION</small>本月輪值・${tm} 月`;
  $('rotBody').innerHTML = rots.map(r=>{
    const now = rotWho(r, ty, tm), next = rotWho(r, ny, nm);
    const mine = !ADMIN && now === NAME, soon = !ADMIN && lastWeek && next === NAME && !mine;
    return `<div class="rot-row ${mine?'me':''}">
      <span class="what">${esc(r.title)}</span>
      <span class="who">${personChip(now)}</span>${mine ? '<span class="rot-badge">輪到你</span>' : ''}
      ${soon ? '<span class="rot-badge soon">下月換你</span>' : `<span class="next">下月<b>${esc(next)}</b></span>`}
    </div>`;
  }).join('');

  // 排班表：接下來 6 個月
  let html = `<table class="rot-tbl"><tr><th>月份</th>${rots.map(r=>`<th>${esc(r.title)}</th>`).join('')}</tr>`;
  for (let i=0; i<6; i++){
    const [y, m] = addMonth(ty, tm, i);
    html += `<tr class="${i===0?'cur':''}"><td>${y!==ty?y+'/':''}${m} 月</td>` +
      rots.map(r=>{ const w = rotWho(r, y, m); return `<td class="${!ADMIN && w===NAME?'mine':''}">${esc(w)}</td>`; }).join('') + '</tr>';
  }
  $('rotTable').innerHTML = html + '</table>';
}
function toggleRot(){
  const t = $('rotTable'), open = t.style.display === 'none';
  t.style.display = open ? '' : 'none';
  $('rotToggle').textContent = open ? '排班表 ▴' : '排班表 ▾';
}

/* ---------- 設定：主題 ---------- */

const THEMES = [
  { id:'c', name:'深藍金', bar:'#0b1f36', card:'#12304f', body:'#fdfcf8', meta:'#0b1f36' },
  { id:'d', name:'香檳金', bar:'#f8f3e8', card:'#efe2bf', body:'#fbf8f1', meta:'#f8f3e8' },
  { id:'e', name:'霧藍灰', bar:'#f4f7fa', card:'#d8e3ee', body:'#f6f8fb', meta:'#f4f7fa' },
  { id:'k',  name:'銀漸層', bar:'linear-gradient(180deg,#fdfdfe,#c9ced5,#e9ebee)', card:'linear-gradient(160deg,#f6f7f9,#cfd4db,#eef0f3,#b9bfc8)', body:'#f7f8fa', meta:'#e3e6ea' },
  { id:'m4', name:'鈦藍',   bar:'linear-gradient(180deg,#f4f8ff,#c9d7ea,#7f9bc0,#dfe8f5)', card:'linear-gradient(160deg,#f4f8ff,#c9d7ea,#dfe8f5,#7f9bc0)', body:'#f7f9fc', meta:'#c9d7ea' },
  { id:'m5', name:'槍灰',   bar:'linear-gradient(180deg,#7a7f88,#50555d,#2e3137,#5c616a)', card:'linear-gradient(160deg,#7a7f88,#50555d,#5c616a,#2e3137)', body:'#f6f7f8', meta:'#3a3e45' },
];
function curTheme(){ const c = document.documentElement.className.match(/theme-(d|e|k|m4|m5)\b/); return c ? c[1] : 'c'; }
function setTheme(id){
  document.documentElement.className = id==='c' ? '' : 'theme-' + id;
  store('leave_theme', id==='c' ? '' : id);
  const t = THEMES.find(x=>x.id===id);
  document.querySelector('meta[name="theme-color"]').setAttribute('content', t.meta);
  renderThemes();
}
function renderThemes(){
  const cur = curTheme();
  $('thOpts').innerHTML = THEMES.map(t=>`
    <button class="th-opt ${t.id===cur?'cur':''}" onclick="setTheme('${t.id}')">
      <span class="th-prev"><i style="height:14px;background:${t.bar};border-bottom:2px solid #c9a227"></i>
        <i style="height:16px;margin:4px 5px;border-radius:4px;background:${t.card}"></i>
        <i style="flex:1;background:${t.body}"></i></span>${t.name}${t.id===cur?' ✓':''}
    </button>`).join('');
}
function openSettings(){
  renderThemes();
  $('setPinBox').style.display = ADMIN ? 'none' : '';
  openMask('setMask');
}
(function(){ const t = THEMES.find(x=>x.id===curTheme()); document.querySelector('meta[name="theme-color"]').setAttribute('content', t.meta); })();

/* ---------- 改假別 ---------- */

const TYPE_DESC = {
  '休假':   '天塌下來也別找我 🏖️',
  '代理OP': '心不甘情不願地去支援 😮‍💨',
  '鉛筆假': '先畫個圈，人家真有急事再擦掉 ✏️',
};
let TYPE_TARGET = null;
function openType(from, i){
  const r = from==='day' ? openDay._rows[i] : renderUpcoming._groups[i];
  const range = from==='day' ? `${shortDate(DAY)} ${r.slot}`
              : (r.start===r.end ? `${shortDate(r.start)} ${r.slot}` : `${shortDate(r.start)} – ${shortDate(r.end)}（${r.days} 天）`);
  TYPE_TARGET = { ids:r.ids, type:r.type, name:r.name };
  $('typeInfo').textContent = (ADMIN ? r.name+'・' : '') + range;
  $('typeOpts').innerHTML = INIT.types.map(t=>{
    const sw = t===PENCIL ? 'pencil' : '';
    const st = isAlt(t) ? 'background:#fff' : t===PENCIL ? '' : 'background:var(--muted)';
    return `<button class="type-opt ${t===r.type?'cur':''}" onclick="doChangeType('${esc(t)}',this)">
      <span class="sw ${sw}" style="${st}"></span><span><b>${esc(t)}</b><small>${esc(TYPE_DESC[t]||'')}</small></span></button>`;
  }).join('');
  closeMask('dayMask'); openMask('typeMask');
}
function doChangeType(t, btn){
  if (t===TYPE_TARGET.type) return closeMask('typeMask');
  if (TYPE_TARGET.type===PENCIL && REQS.some(q=>q.status==='待回覆' && q.owner===TYPE_TARGET.name) &&
      !confirm('有人正在申請你這張鉛筆假，改成其他假別後，對方的申請會自動失效。確定要改嗎？')) return;
  busyBtn(btn, true, '修改中…');
  api('changeLeaveType', TYPE_TARGET.ids, t).then(()=>{
    toast(`已改成${t}`); closeMask('typeMask'); invalidate(); refresh();
  }).catch(e=>{ busyBtn(btn, false); toast(e.message); });
}

/* ---------- 鉛筆假：申請讓出 / 回覆 ---------- */

let REQS = [];
function loadRequests(){
  if (!TOKEN) return;
  api('getRequests').then(r=>{ REQS = r || []; renderRequests(); }).catch(()=>{});
}
function dismissed(){ try { return JSON.parse(localStorage.getItem('leave_dismiss')||'[]'); } catch(e){ return []; } }
function dismissReq(id){ const d = dismissed(); d.push(id); store('leave_dismiss', JSON.stringify(d.slice(-200))); renderRequests(); }

function renderRequests(){
  const dis = dismissed();
  const incoming = REQS.filter(q=>q.status==='待回覆' && (ADMIN || q.owner===NAME));
  const outgoing = REQS.filter(q=>q.status==='待回覆' && !ADMIN && q.from===NAME);
  const results  = REQS.filter(q=>q.status!=='待回覆' && !ADMIN && q.from===NAME && q.status!=='已撤回' && dis.indexOf(q.id)<0);
  let html = '';
  if (incoming.length) {
    html += `<div class="rq-sec">待${ADMIN?'':'你'}回覆</div>` + incoming.map(q=>`
      <div class="rq">
        <div class="rq-txt"><b>${esc(q.from)}</b> 想要${ADMIN?' <b>'+esc(q.owner)+'</b> ':'你'} <b>${esc(shortDate(q.date))} ${esc(q.slot)}</b> 的鉛筆假，改成${esc(q.type)}</div>
        ${q.reason?`<div class="rq-reason">事由：${esc(q.reason)}</div>`:''}
        <div class="rq-btns"><button onclick="answerReq('${q.id}',false,this)">拒絕</button><button class="ok" onclick="answerReq('${q.id}',true,this)">同意讓出</button></div>
      </div>`).join('');
  }
  if (outgoing.length) {
    html += `<div class="rq-sec">你的申請</div>` + outgoing.map(q=>`
      <div class="rq done">
        <div class="rq-txt">等 <b>${esc(q.owner)}</b> 回覆：${esc(shortDate(q.date))} ${esc(q.slot)}（${esc(q.type)}）</div>
        <button class="ghost" onclick="withdrawReq('${q.id}',this)">撤回</button>
      </div>`).join('');
  }
  if (results.length) {
    const word = { '已同意':'✅ 同意了', '已拒絕':'❌ 拒絕了', '已失效':'⚠️ 已失效：' };
    html += `<div class="rq-sec">結果</div>` + results.map(q=>`
      <div class="rq done">
        <div class="rq-txt">${q.status==='已失效'
          ? `⚠️ 你向 <b>${esc(q.owner)}</b> 申請的 ${esc(shortDate(q.date))} ${esc(q.slot)} 已失效（鉛筆假已變動）`
          : `<b>${esc(q.owner)}</b> ${word[q.status]}你的申請：${esc(shortDate(q.date))} ${esc(q.slot)}${q.status==='已同意'?'，已登記為'+esc(q.type):''}`}</div>
        <button class="x" onclick="dismissReq('${q.id}')">✕</button>
      </div>`).join('');
  }
  $('reqBody').innerHTML = html;
  $('reqCard').classList.toggle('show', !!html);
}

function answerReq(id, accept, btn){
  const q = REQS.find(x=>x.id===id);
  if (accept && !confirm(`確定把 ${shortDate(q.date)} ${q.slot} 的鉛筆假讓給 ${q.from}？`)) return;
  busyBtn(btn, true, accept ? '讓出中…' : '處理中…');
  api('respondRequest', id, accept).then(()=>{
    toast(accept ? `已讓給 ${q.from}` : '已拒絕');
    REQS = REQS.filter(x=>x.id!==id); renderRequests();      // 先把這筆從畫面拿掉，不用等重新整理
    invalidate(); refresh();
  }).catch(e=>{ busyBtn(btn, false); toast(e.message); refresh(); });
}
function withdrawReq(id, btn){
  if (!confirm('確定撤回這筆申請？')) return;
  busyBtn(btn, true, '撤回中…');
  api('withdrawRequest', id).then(()=>{ toast('已撤回'); REQS = REQS.filter(x=>x.id!==id); renderRequests(); })
    .catch(e=>{ busyBtn(btn, false); toast(e.message); refresh(); });
}

let ASK = null;
function openAsk(i){
  const r = openDay._rows[i];
  const mine = new Set();
  leavesOn(DAY).filter(l=>l.name===NAME).forEach(l=>slotsOf(l.slot).forEach(x=>mine.add(x)));
  // 可以申請的時段：這張鉛筆假涵蓋、而且我自己那個時段還沒登記
  const covered = r.parts.flatMap(p=>slotsOf(p.slot)).filter(x=>!mine.has(x));
  if (!covered.length) return toast('你這天的時段都已經有登記了');
  const opts = covered.length===2 ? ['全天','上午','下午'] : covered;
  $('askSlot').innerHTML = opts.map(o=>`<option>${o}</option>`).join('');
  $('askType').innerHTML = INIT.types.filter(t=>!isPencil(t)).map(t=>`<option>${esc(t)}</option>`).join('');
  $('askReason').value=''; showErr('askErr','');
  $('askInfo').textContent = `向 ${r.name} 申請 ${shortDate(DAY)} 的鉛筆假`;
  ASK = { row:r, date:DAY };
  closeMask('dayMask'); openMask('askMask');
}
function submitAsk(){
  const reason = $('askReason').value.trim();   // 事由選填
  const slot = $('askSlot').value, type = $('askType').value;
  // 鉛筆假如果是上午、下午分開兩筆，全天就分兩張申請送出
  const want = slotsOf(slot);
  const targets = ASK.row.parts.map(p=>({ id:p.id, slots:slotsOf(p.slot).filter(x=>want.indexOf(x)>=0) })).filter(p=>p.slots.length);
  const btn=$('askSubmit'); btn.disabled=true; btn.textContent='送出中…';
  targets.reduce((pr,t)=>pr.then(()=>api('requestPencil', { leaveId:t.id, slot: t.slots.length===2?'全天':t.slots[0], type, reason })), Promise.resolve())
    .then(()=>{ closeMask('askMask'); toast(`已送出，等 ${ASK.row.name} 同意`); loadRequests(); })
    .catch(e=>showErr('askErr', e.message))
    .finally(()=>{ btn.disabled=false; btn.textContent='送出申請'; });
}

/* ---------- 管理員 ---------- */

/* 管理員換了請假人：清掉已選日期，重新判斷哪些天可以請 */
$('fWho').addEventListener('change', ()=>{ PK.sel.clear(); pkRender(); });

function openAdmin(){
  $('adminBody').className='loading'; $('adminBody').textContent='載入中…';
  openMask('adminMask');
  api('adminPinStatus').then(list=>{
    $('adminBody').className='';
    $('adminBody').innerHTML = list.map(p=>`
      <div class="dt-row">
        <span class="ini-lg" style="background:${colorOf[p.name]||'#666'}">${esc(initialOf[p.name]||p.name.charAt(0))}</span>
        <div class="info"><div style="font-weight:600">${esc(p.name)}</div><div class="muted">PIN：${esc(p.status)}</div></div>
        <button class="danger" onclick="adminReset('${esc(p.name)}')">重設 PIN</button>
      </div>`).join('');
  }).catch(e=>{ $('adminBody').className=''; $('adminBody').textContent=e.message; });
}
function adminReset(name){
  if (!confirm(`確定把 ${name} 的 PIN 重設成 0000？`)) return;
  api('adminResetPin', name).then(()=>{ toast(`${name} 的 PIN 已重設為 0000`); openAdmin(); }).catch(e=>toast(e.message));
}

/* ---------- 改 PIN ---------- */

function openPin(force, oldPin){
  FORCE = !!force; FORCE_OLD = oldPin || '';
  ['pOld','pNew','pNew2'].forEach(i=>$(i).value=''); showErr('pErr','');
  $('pTitle').textContent = FORCE ? '設定你的 PIN 碼' : '修改 PIN 碼';
  $('pHint').style.display = FORCE ? 'block' : 'none';
  $('pCancel').style.display = FORCE ? 'none' : '';
  $('pOldBox').style.display = (FORCE && FORCE_OLD) ? 'none' : '';
  openMask('pinMask');
}
function submitPin(){
  const o = (FORCE && FORCE_OLD) ? FORCE_OLD : $('pOld').value.trim();
  const n=$('pNew').value.trim(), n2=$('pNew2').value.trim();
  if(!/^\d{4,8}$/.test(n)) return showErr('pErr','新 PIN 需為 4–8 位數字');
  if(n!==n2) return showErr('pErr','兩次輸入的新 PIN 不一樣');
  const btn=$('pSubmit'); btn.disabled=true;
  api('changePin', o, n).then(r=>{
    if(!r.ok) return showErr('pErr', r.msg);
    TOKEN=r.token; store('leave_token',TOKEN);
    const wasForce = FORCE; FORCE=false; FORCE_OLD='';
    closeMask('pinMask'); toast('PIN 已設定');
    if (wasForce) showApp();
  }).catch(e=>showErr('pErr',e.message)).finally(()=>btn.disabled=false);
}
