<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CS 假單</title>
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CS 假單">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232563eb'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='700'%3E假%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%232563eb'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='700'%3E假%3C/text%3E%3C/svg%3E">
<style>
  :root { --bg:#f3f4f6; --card:#fff; --text:#111827; --muted:#6b7280; --line:#e5e7eb; --accent:#2563eb; --bad:#dc2626; --soft:#f9fafb; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif; background:var(--bg); color:var(--text); font-size:15px; }
  select, input, textarea, button { font:inherit; }
  select, input, textarea { padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:#fff; width:100%; }
  button { border:0; border-radius:10px; padding:9px 14px; cursor:pointer; background:#eef2ff; color:var(--accent); }
  button.primary { background:var(--accent); color:#fff; }
  button.ghost { background:transparent; color:var(--muted); padding:6px 8px; font-size:13px; }
  button.danger { background:#fee2e2; color:var(--bad); padding:6px 10px; font-size:13px; flex-shrink:0; }
  button:disabled { opacity:.6; }

  /* 標頭 */
  header { background:var(--card); padding:10px 16px; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5;
           display:flex; align-items:center; justify-content:space-between; gap:8px; }
  header h1 { margin:0; font-size:17px; white-space:nowrap; }
  .me { display:flex; align-items:center; gap:2px; min-width:0; }
  .avatar { width:28px; height:28px; border-radius:50%; color:#fff; font-size:13px; font-weight:700;
            display:inline-flex; align-items:center; justify-content:center; margin-right:6px; flex-shrink:0; }
  .me b { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-right:4px; }

  main { padding:12px 12px calc(96px + env(safe-area-inset-bottom)); max-width:760px; margin:0 auto; }
  .card { background:var(--card); border-radius:14px; padding:12px; margin-bottom:12px; box-shadow:0 1px 2px rgba(0,0,0,.05); }
  .muted { color:var(--muted); font-size:13px; }

  /* 月曆 */
  .nav { display:flex; align-items:center; gap:6px; margin-bottom:8px; }
  .nav .title { flex:1; font-size:18px; font-weight:700; padding-left:4px; }
  .nav button { height:34px; padding:0 12px; font-size:14px; }
  .nav .arrow { width:34px; padding:0; font-size:18px; }
  .grid { display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); gap:4px 3px; }
  .wd { text-align:center; font-size:12px; color:var(--muted); padding:2px 0 6px; font-weight:600; }
  .wd.we { color:#b0b6bf; }
  .day { min-height:60px; border-radius:10px; background:#f8fafc; padding:4px 3px; font-size:12px; cursor:pointer;
         min-width:0; overflow:hidden; text-align:center; transition:background .15s; }
  .day:active { background:#e0e7ff; }
  .day.empty { background:transparent; cursor:default; }
  .day.weekend { background:transparent; }
  .day.weekend .num { color:#b0b6bf; }
  .day.past { opacity:.38; }
  .day.full { background:#fff7ed; }
  .day.holiday { background:#fef2f2; }
  .day.holiday .num { color:var(--bad); }
  .num { display:inline-flex; width:24px; height:24px; align-items:center; justify-content:center; border-radius:50%;
         font-weight:600; font-size:13px; }
  .day.today .num { background:var(--accent); color:#fff; }
  /* 已選日期：深色框＋右上角打勾（不用藍色，避免跟「今天」和人員顏色混淆） */
  .day { position:relative; }
  .day.sel { background:#fff; box-shadow:inset 0 0 0 2px #111827; }
  .day.sel::after { content:'✓'; position:absolute; top:3px; right:3px; width:15px; height:15px; border-radius:50%;
                    background:#111827; color:#fff; font-size:10px; line-height:15px; text-align:center; font-weight:700; }

  /* 已選日期列 */
  .selbar { position:fixed; left:12px; right:12px; bottom:calc(14px + env(safe-area-inset-bottom)); z-index:6;
            display:none; align-items:center; gap:8px; background:#fff; border-radius:16px; padding:10px 10px 10px 14px;
            box-shadow:0 8px 24px rgba(0,0,0,.18); max-width:736px; margin:0 auto; }
  .selbar.show { display:flex; }
  .selbar .selinfo { flex:1; min-width:0; }
  .selbar .selinfo b { display:block; font-size:15px; }
  .selbar .selinfo span { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .selbar button { padding:10px 14px; font-weight:600; flex-shrink:0; }
  .hint { font-size:12px; color:var(--muted); text-align:center; margin-top:8px; }

  /* 表單裡的已選日期 */
  .selchips { display:flex; flex-wrap:wrap; gap:6px; margin-top:4px; }
  .selchips span { background:#f3f4f6; color:#111827; border:1px solid #d1d5db; border-radius:999px; padding:4px 10px; font-size:13px; font-weight:600; }
  .selbar { border:1.5px solid #111827; }
  .selbar .selinfo b::before { content:'✓'; display:inline-flex; width:18px; height:18px; border-radius:50%; background:#111827; color:#fff;
                               font-size:11px; align-items:center; justify-content:center; margin-right:6px; vertical-align:1px; }
  .hname { display:block; color:var(--bad); font-size:10px; line-height:1.3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hname.work { color:var(--accent); }
  /* 每天分成上、下兩格：上格 = 上午、下格 = 下午；有人請就塗上那個人的顏色 */
  .slots { display:flex; flex-direction:column; gap:2px; margin-top:3px; }
  .slot { display:flex; gap:2px; height:17px; }
  .slot.empty { border-radius:5px; background:repeating-linear-gradient(135deg, transparent 0 4px, rgba(0,0,0,.035) 4px 8px);
                box-shadow:inset 0 0 0 1px rgba(0,0,0,.05); }
  .seg { flex:1; min-width:0; border-radius:5px; display:flex; align-items:center; justify-content:center;
         font-size:11px; font-weight:800; color:#fff; border:1.5px solid transparent; line-height:1; overflow:hidden; }
  .seg.alt { background:#fff !important; }   /* 代理OP：空心框 */
  .legend .ini { display:inline-flex; align-items:center; justify-content:center; width:18px; height:18px; border-radius:50%;
                 color:#fff; font-size:10.5px; font-weight:800; margin-right:4px; vertical-align:-4px; }

  /* 近期清單的日期方塊 */
  .datebox { width:50px; flex-shrink:0; text-align:center; border-radius:10px; background:var(--soft); overflow:hidden; border:1px solid var(--line); }
  .datebox .dm { font-size:11px; color:#fff; padding:2px 0; font-weight:600; }
  .datebox .dd { font-size:20px; font-weight:700; line-height:1.25; }
  .datebox .dw { font-size:11px; color:var(--muted); padding-bottom:3px; }
  .info { flex:1; min-width:0; }

  .legend { display:flex; gap:6px 12px; flex-wrap:wrap; font-size:12px; color:var(--muted); margin-top:10px; padding-top:10px; border-top:1px solid var(--line); }
  .legend .sep { flex-basis:100%; height:0; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:4px; vertical-align:-1px; }
  .sw { display:inline-block; width:18px; height:10px; border-radius:3px; margin-right:4px; vertical-align:-1px; border:1.5px solid var(--muted); }

  /* 近期清單 */
  .sec-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }
  .item { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); gap:10px; }
  .item:last-child { border-bottom:0; }
  .item .who { display:flex; align-items:center; gap:6px; font-weight:600; }
  .item .when { margin-top:2px; }
  .tag { font-size:11px; padding:1px 6px; border-radius:999px; background:#eef2ff; color:var(--accent); font-weight:500; }
  .tag.alt { background:#ecfdf5; color:#047857; }

  .fab { position:fixed; right:16px; bottom:calc(20px + env(safe-area-inset-bottom)); z-index:6;
         border-radius:28px; padding:14px 22px; font-size:16px; font-weight:700;
         box-shadow:0 6px 16px rgba(37,99,235,.35); }

  /* 月曆左右滑動切換 */
  #cal { touch-action:pan-y; }
  #cal.slide-l { animation:slideL .22s ease-out; }
  #cal.slide-r { animation:slideR .22s ease-out; }
  @keyframes slideL { from { opacity:0; transform:translateX(24px); } to { opacity:1; transform:none; } }
  @keyframes slideR { from { opacity:0; transform:translateX(-24px); } to { opacity:1; transform:none; } }

  /* 彈出視窗 */
  .mask { position:fixed; inset:0; background:rgba(0,0,0,.4); display:none; align-items:flex-end; justify-content:center; z-index:10; }
  .mask.show { display:flex; }
  .sheet { background:#fff; width:100%; max-width:520px; border-radius:18px 18px 0 0; padding:18px 16px calc(18px + env(safe-area-inset-bottom));
           max-height:92vh; overflow:auto; box-shadow:0 -6px 24px rgba(0,0,0,.15); }
  label { display:block; font-size:13px; color:var(--muted); margin:12px 0 4px; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .err { background:#fee2e2; color:var(--bad); border-radius:8px; padding:8px 10px; margin-top:10px; font-size:13px; display:none; white-space:pre-line; }
  .actions { display:flex; gap:8px; margin-top:16px; }
  .actions button { flex:1; padding:12px; }
  .toast { position:fixed; left:50%; top:16px; transform:translateX(-50%); background:#111827; color:#fff; padding:10px 16px; border-radius:10px; display:none; z-index:30; max-width:90vw; }
  .loading { text-align:center; color:var(--muted); padding:20px; }

  #loginView { display:none; min-height:100vh; align-items:center; justify-content:center; padding:16px; }
  #loginView .card { width:100%; max-width:360px; padding:22px; }
  #pinIn { font-size:22px; letter-spacing:8px; text-align:center; }
  #appView { display:none; }
  header { padding-top:calc(10px + env(safe-area-inset-top)); }
  #bootView { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; color:var(--muted); padding:24px; text-align:center; }
  .spinner { width:32px; height:32px; border:3px solid var(--line); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>

<!-- 啟動中 -->
<div id="bootView"><div class="spinner"></div><div id="bootMsg">載入中…</div></div>

<!-- 登入 -->
<div id="loginView">
  <div class="card">
    <h2 style="margin:0 0 4px">CS 假單系統</h2>
    <div class="muted">請選擇姓名並輸入個人 PIN 碼</div>
    <label>姓名</label><select id="loginName"></select>
    <label>PIN 碼</label><input id="pinIn" type="password" inputmode="numeric" autocomplete="off" maxlength="8">
    <div class="err" id="loginErr"></div>
    <button class="primary" id="loginBtn" style="width:100%;margin-top:16px;padding:12px" onclick="doLogin()">登入</button>
  </div>
</div>

<!-- 主畫面 -->
<div id="appView">
  <header>
    <h1>CS 假單</h1>
    <div class="me">
      <span class="avatar" id="meAvatar"></span><b id="meName"></b>
      <button class="ghost" onclick="openPin()">改PIN</button>
      <button class="ghost" onclick="logout()">登出</button>
    </div>
  </header>

  <main>
    <div class="card">
      <div class="nav">
        <span class="title" id="monthTitle"></span>
        <button onclick="goToday()">今天</button>
        <button class="arrow" onclick="shiftMonth(-1)">‹</button>
        <button class="arrow" onclick="shiftMonth(1)">›</button>
      </div>
      <div class="grid" id="cal"></div>
      <div class="hint">點日期可以複選，選好按下方「請假」一次送出</div>
      <div class="legend" id="legend"></div>
    </div>

    <div class="card">
      <div class="sec-head"><b>近期請假</b><button class="ghost" onclick="refresh()">↻ 重新整理</button></div>
      <div id="upcoming" class="loading">載入中…</div>
    </div>
  </main>

  <button class="primary fab" id="fab" onclick="openForm()">＋ 請假</button>

  <div class="selbar" id="selBar">
    <div class="selinfo"><b id="selCount"></b><span class="muted" id="selDates"></span></div>
    <button onclick="clearSel()">清除</button>
    <button class="primary" onclick="openForm()">請假</button>
  </div>
</div>

<!-- 請假表單 -->
<div class="mask" id="formMask" onclick="if(event.target===this)closeMask('formMask')">
  <div class="sheet">
    <b style="font-size:17px">申請請假</b>
    <div class="muted" style="margin-top:4px">請假人：<b id="formName"></b></div>
    <label>假別</label><select id="fType"></select>
    <div id="selBox" style="display:none">
      <label>請假日期</label>
      <div class="selchips" id="selChips"></div>
    </div>
    <div class="two" id="rangeBox">
      <div><label>開始日</label><input type="date" id="fStart"></div>
      <div><label>結束日</label><input type="date" id="fEnd"></div>
    </div>
    <label>時段</label>
    <select id="fSlot"><option>全天</option><option>上午</option><option>下午</option></select>
    <label>事由（選填）</label><textarea id="fReason" rows="2" maxlength="200"></textarea>
    <div class="muted" id="skipTxt" style="margin-top:6px"></div>
    <div class="err" id="fErr"></div>
    <div class="actions">
      <button onclick="closeMask('formMask')">取消</button>
      <button class="primary" id="fSubmit" onclick="submitForm()">送出</button>
    </div>
  </div>
</div>

<!-- 改 PIN -->
<div class="mask" id="pinMask" onclick="if(event.target===this&&!FORCE)closeMask('pinMask')">
  <div class="sheet">
    <b style="font-size:17px" id="pTitle">修改 PIN 碼</b>
    <div class="muted" id="pHint" style="margin-top:4px;display:none">首次登入（或 PIN 被重設），請先設定自己的 PIN 才能使用。</div>
    <div id="pOldBox"><label>目前 PIN</label><input id="pOld" type="password" inputmode="numeric" maxlength="8"></div>
    <label>新 PIN（4–8 位數字）</label><input id="pNew" type="password" inputmode="numeric" maxlength="8">
    <label>再輸入一次</label><input id="pNew2" type="password" inputmode="numeric" maxlength="8">
    <div class="err" id="pErr"></div>
    <div class="actions">
      <button id="pCancel" onclick="closeMask('pinMask')">取消</button>
      <button class="primary" id="pSubmit" onclick="submitPin()">儲存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ====== 設定：貼上 Apps Script 部署後的「網頁應用程式網址」（結尾是 /exec） ====== */
const API_URL = 'https://script.google.com/macros/s/AKfycbznum_5tyCbBKmoigxujp26vkuMPcJiPj8ke9_6byY5gajVrqjuwVzwp150QnVbvEHd/exec';
/* ============================================================================= */

let FORCE = false, FORCE_OLD = '';
let INIT = null, TOKEN = '', NAME = '', cur = { y:0, m:0 }, monthLeaves = [], upcoming = [], colorOf = {};
const initialOf = {};
const WD = '日一二三四五六';

const $ = id => document.getElementById(id);
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function pad(n){ return (n<10?'0':'')+n; }
function ymd(y,m,d){ return y+'-'+pad(m)+'-'+pad(d); }
function daysIn(y,m){ return new Date(y,m,0).getDate(); }
function parts(s){ return s.split('-').map(Number); }
function wdIdx(s){ const [y,m,d]=parts(s); return new Date(Date.UTC(y,m-1,d)).getUTCDay(); }
function addDays(s,n){ const [y,m,d]=parts(s); const t=new Date(Date.UTC(y,m-1,d+n)); return ymd(t.getUTCFullYear(),t.getUTCMonth()+1,t.getUTCDate()); }
function shortDate(s){ const [y,m,d]=parts(s); return (y!==parts(INIT.today)[0]?y+'/':'')+m+'/'+d+'（'+WD[wdIdx(s)]+'）'; }
function toast(msg){ const t=$('toast'); t.textContent=msg; t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none',2500); }
function store(k,v){ try{ v ? localStorage.setItem(k,v) : localStorage.removeItem(k); }catch(e){} }
function load(k){ try{ return localStorage.getItem(k)||''; }catch(e){ return ''; } }
function showErr(id,msg){ const e=$(id); e.textContent=msg; e.style.display=msg?'block':'none'; }
function closeMask(id){ $(id).classList.remove('show'); }
function openMask(id){ $(id).classList.add('show'); }
function holiday(ds){ return (INIT.holidays||{})[ds]; }
function isOff(ds){
  const h = holiday(ds), w = wdIdx(ds);
  if (h && h.type==='放假') return true;
  if (h && h.type==='補班') return false;
  return INIT.skipWeekends && (w===0||w===6);
}
function nextWorkday(ds){ let d=addDays(ds,1), i=0; while(isOff(d) && i++<30) d=addDays(d,1); return d; }
function isAlt(type){ return INIT.types.indexOf(type) > 0; }   // 第二種以後的假別（代理OP）用空心標籤

/** 呼叫 Apps Script API。用 text/plain 送出，瀏覽器不會先發 CORS 預檢請求 */
async function call(fn,...args){
  let res;
  try {
    res = await fetch(API_URL, {
      method:'POST',
      headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify({ fn, args }),
    });
  } catch(e) {
    throw new Error('連不上伺服器，請檢查網路後再試一次');
  }
  let j;
  try { j = await res.json(); }
  catch(e) { throw new Error('伺服器回應格式不正確（請確認 API 網址與部署權限）'); }
  if (!j.ok) throw new Error(j.error || '伺服器錯誤');
  return j.data;
}
function api(fn,...args){
  return call(fn, TOKEN, ...args).catch(e=>{
    const m = String(e.message||e);
    if (m.indexOf('MUSTCHANGE')>=0){ openPin(true, ''); e = new Error('請先設定新的 PIN'); }
    else if (m.indexOf('AUTH')>=0){ logout(); toast('登入已失效，請重新登入'); }
    throw e;
  });
}

/* ---------- 初始化 / 登入 ---------- */

call('getInitData').then(d=>{
  INIT = d;
  d.staff.forEach(s=>colorOf[s.name]=s.color);
  // 名字縮寫：預設第一個字母；如果有人撞同一個字母，就改用前兩個字
  d.staff.forEach(s=>{
    const one = s.name.charAt(0).toUpperCase();
    const clash = d.staff.some(o=>o.name!==s.name && o.name.charAt(0).toUpperCase()===one);
    initialOf[s.name] = clash ? s.name.slice(0,2) : one;
  });
  $('loginName').innerHTML = '<option value="">（選擇）</option>' + d.staff.map(s=>`<option>${esc(s.name)}</option>`).join('');
  $('fType').innerHTML = d.types.map(t=>`<option>${esc(t)}</option>`).join('');
  $('skipTxt').textContent = d.skipWeekends ? '區間請假會自動略過週六日與國定假日' : '區間請假會自動略過國定假日';
  $('legend').innerHTML =
    d.staff.map(s=>`<span><span class="ini" style="background:${s.color}">${esc(initialOf[s.name])}</span>${esc(s.name)}</span>`).join('') +
    '<span class="sep"></span>' +
    d.types.map((t,i)=>`<span><span class="sw" style="${i?'':'background:var(--muted)'}"></span>${esc(t)}</span>`).join('') +
    `<span>・上格＝上午、下格＝下午，各限 ${d.limits.map(x=>x.limit).join('/')} 人</span>`;
  const t = parts(d.today); cur = { y:t[0], m:t[1] };

  TOKEN = load('leave_token'); NAME = load('leave_name');
  $('bootView').style.display='none';
  TOKEN && NAME ? showApp() : showLogin();
}).catch(e=>{
  $('bootView').querySelector('.spinner').style.display='none';
  $('bootMsg').innerHTML = `載入失敗：${esc(e.message)}<br><br><button class="primary" onclick="location.reload()">重新載入</button>`;
});

function showLogin(){
  $('appView').style.display='none'; $('loginView').style.display='flex';
  $('loginName').value = load('leave_name'); $('pinIn').value=''; showErr('loginErr','');
}
function showApp(){
  $('loginView').style.display='none'; $('appView').style.display='block';
  $('meName').textContent = NAME;
  $('meAvatar').textContent = NAME.charAt(0).toUpperCase();
  $('meAvatar').style.background = colorOf[NAME] || '#6b7280';
  refresh();
}
$('pinIn').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });

function doLogin(){
  const name=$('loginName').value, pin=$('pinIn').value.trim();
  if(!name) return showErr('loginErr','請選擇姓名');
  if(!pin) return showErr('loginErr','請輸入 PIN');
  const btn=$('loginBtn'); btn.disabled=true; btn.textContent='驗證中…';
  call('login', name, pin).then(r=>{
    if(!r.ok) return showErr('loginErr', r.msg);
    TOKEN=r.token; NAME=r.name; store('leave_token',TOKEN); store('leave_name',NAME);
    if (r.mustChange) openPin(true, pin); else showApp();
  }).catch(e=>showErr('loginErr',e.message)).finally(()=>{ btn.disabled=false; btn.textContent='登入'; });
}
function logout(){ TOKEN=''; store('leave_token',''); SEL.clear(); afterSel(); showLogin(); }

/* 手機上 App 一直開著、隔天再切回來時：更新「今天」與最新假單，避免日期停在前一天 */
let lastSync = Date.now();
document.addEventListener('visibilitychange', ()=>{
  if (document.visibilityState!=='visible' || !TOKEN || !INIT) return;
  if (Date.now() - lastSync < 60*1000) return;   // 一分鐘內不重複更新
  lastSync = Date.now();
  call('getInitData').then(d=>{
    const dayChanged = d.today !== INIT.today;
    INIT.today = d.today; INIT.holidays = d.holidays;
    if (dayChanged) [...SEL].forEach(x=>{ if (x < d.today) SEL.delete(x); });
    afterSel(); refresh();
  }).catch(()=>{});
});

/* ---------- 月曆 ---------- */

function refresh(){ loadMonth(); loadUpcoming(); }
function shiftMonth(n){
  cur.m+=n; if(cur.m<1){cur.m=12;cur.y--;} if(cur.m>12){cur.m=1;cur.y++;}
  const cal=$('cal'); cal.classList.remove('slide-l','slide-r'); void cal.offsetWidth;
  cal.classList.add(n>0?'slide-l':'slide-r');
  loadMonth();
}

/* 月曆左右滑：往左滑 = 下個月，往右滑 = 上個月 */
(function(){
  let x0=null, y0=null;
  const cal=$('cal');
  cal.addEventListener('touchstart', e=>{ const t=e.touches[0]; x0=t.clientX; y0=t.clientY; }, { passive:true });
  cal.addEventListener('touchend', e=>{
    if (x0===null) return;
    const t=e.changedTouches[0], dx=t.clientX-x0, dy=t.clientY-y0;
    x0=y0=null;
    if (Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)*1.5) shiftMonth(dx<0?1:-1);
  }, { passive:true });
})();
function goToday(){ const t=parts(INIT.today); cur={ y:t[0], m:t[1] }; loadMonth(); }

function loadMonth(){
  $('monthTitle').textContent = `${cur.y} 年 ${cur.m} 月`;
  api('getLeaves', ymd(cur.y,cur.m,1), ymd(cur.y,cur.m,daysIn(cur.y,cur.m)))
    .then(r=>{ monthLeaves=r; renderCal(); }).catch(e=>toast(e.message));
}

function renderCal(){
  const byDate = {};
  monthLeaves.forEach(l=>(byDate[l.date]=byDate[l.date]||[]).push(l));
  // 週日開始：日 一 二 三 四 五 六
  let html = WD.split('').map((w,i)=>`<div class="wd ${i===0||i===6?'we':''}">${w}</div>`).join('');
  const lead = new Date(cur.y,cur.m-1,1).getDay();
  for (let i=0;i<lead;i++) html += '<div class="day empty"></div>';
  for (let d=1; d<=daysIn(cur.y,cur.m); d++){
    const ds=ymd(cur.y,cur.m,d), list=byDate[ds]||[], wd=(lead+d-1)%7, cls=['day'];
    const h = holiday(ds);
    if (h && h.type==='放假') cls.push('holiday');
    else if ((wd===0||wd===6) && !(h && h.type==='補班')) cls.push('weekend');
    if (ds<INIT.today) cls.push('past');
    if (ds===INIT.today) cls.push('today');
    if (list.length && !freeTypes(list).length) cls.push('full');
    if (SEL.has(ds)) cls.push('sel');
    const hTag = h ? `<span class="hname ${h.type==='補班'?'work':''}">${esc(h.type==='補班'?'補班':h.name)}</span>` : '';
    // 上、下兩格：每格放這個時段的人（休假實心、代理OP 空心），全天假會同時塗滿兩格
    const workday = !isOff(ds);
    let slotsHtml = '';
    if (workday || list.length) {
      slotsHtml = '<div class="slots">' + ['上午','下午'].map(s=>{
        const here = list.filter(l=>slotsOf(l.slot).indexOf(s)>=0)
                         .sort((a,b)=>INIT.types.indexOf(a.type)-INIT.types.indexOf(b.type));
        if (!here.length) return `<div class="slot empty" title="${s}"></div>`;
        return '<div class="slot">' + here.map(l=>{
          const c = colorOf[l.name]||'#666', alt = isAlt(l.type);
          const style = alt ? `border-color:${c};color:${c}` : `background:${c}`;
          return `<span class="seg ${alt?'alt':''}" style="${style}" title="${esc(l.name)} ${s} ${esc(l.type)}">${esc(initialOf[l.name]||l.name.charAt(0))}</span>`;
        }).join('') + '</div>';
      }).join('') + '</div>';
    }
    html += `<div class="${cls.join(' ')}" onclick="tapDay('${ds}')"><div class="num">${d}</div>${hTag}${slotsHtml}</div>`;
  }
  $('cal').innerHTML = html;
}

/* 名額以時段計算：全天 = 上午＋下午 */
function slotsOf(slot){ return slot==='上午' ? ['上午'] : slot==='下午' ? ['下午'] : ['上午','下午']; }
function freeSlots(list, type){
  const lim = (INIT.limits.find(x=>x.type===type)||{limit:1}).limit;
  return ['上午','下午'].filter(s => list.filter(l=>l.type===type && slotsOf(l.slot).indexOf(s)>=0).length < lim);
}
function freeTypes(list){ return INIT.types.filter(t => freeSlots(list,t).length); }

/* ---------- 月曆複選日期 ---------- */

const SEL = new Set();   // 已選的日期（可以跨月份）

/** 某天所有人的假：合併本月與近期資料 */
function leavesOn(ds){
  const seen = {}, out = [];
  monthLeaves.concat(upcoming).forEach(l=>{ if (l.date===ds && !seen[l.id]) { seen[l.id]=1; out.push(l); } });
  return out;
}

function tapDay(ds){
  if (ds<INIT.today) return;
  if (SEL.has(ds)) { SEL.delete(ds); return afterSel(); }
  const h = holiday(ds);
  if (h && h.type==='放假') return toast(`${shortDate(ds)} ${h.name}`);
  if (isOff(ds)) return;
  const list = leavesOn(ds);
  if (mySlots(list).size === 2) return toast(`${shortDate(ds)} 你已經登記整天了`);
  const free = INIT.types.filter(t => availSlots(list,t).length);
  if (!free.length) return toast(`${shortDate(ds)} 已滿：` + list.map(l=>`${l.name}${l.slot!=='全天'?'（'+l.slot+'）':''} ${l.type}`).join('、'));
  const s = availSlots(list, free[0]);
  if (s.length===1) toast(`${shortDate(ds)} 只剩${s[0]}可請`);
  SEL.add(ds);
  afterSel();
}

function clearSel(){ SEL.clear(); afterSel(); }

function afterSel(){
  renderCal();
  const dates = [...SEL].sort();
  $('selBar').classList.toggle('show', dates.length>0);
  $('fab').style.display = dates.length ? 'none' : '';
  $('selCount').textContent = `已選 ${dates.length} 天`;
  $('selDates').textContent = dates.map(shortDate).join('、');
}

/** 所有已選日期都還有名額的假別與時段，當作表單預設值 */
/** 自己這天已經登記的時段 */
function mySlots(list){
  const s = new Set();
  list.filter(l=>l.name===NAME).forEach(l=>slotsOf(l.slot).forEach(x=>s.add(x)));
  return s;
}
/** 自己還能請的時段：有名額、而且自己還沒登記 */
function availSlots(list, type){ const m = mySlots(list); return freeSlots(list, type).filter(s=>!m.has(s)); }

function commonFree(dates){
  for (const t of INIT.types){
    let slots = ['上午','下午'];
    for (const d of dates) { const f = availSlots(leavesOn(d), t); slots = slots.filter(s=>f.indexOf(s)>=0); }
    if (slots.length) return { type:t, slot: slots.length===2 ? '全天' : slots[0] };
  }
  return { type:INIT.types[0], slot:'全天' };
}

/* ---------- 近期清單：連續上班日合併成一段 ---------- */

function loadUpcoming(){
  api('getLeaves', INIT.today, addDays(INIT.today,90)).then(r=>{ upcoming=r; renderUpcoming(); }).catch(e=>toast(e.message));
}

function groupLeaves(list){
  // 先把「同一人、同假別、同一天」的上午＋下午合併成全天
  const byDay = {}, merged = [];
  list.forEach(l=>{ const k = l.name+'|'+l.type+'|'+l.date; (byDay[k]=byDay[k]||[]).push(l); });
  Object.keys(byDay).forEach(k=>{
    const arr = byDay[k];
    const am = arr.find(l=>l.slot==='上午'), pm = arr.find(l=>l.slot==='下午');
    if (am && pm) {
      merged.push(Object.assign({}, am, { slot:'全天', ids:[am.id, pm.id], reason: am.reason || pm.reason }));
      arr.filter(l=>l!==am && l!==pm).forEach(l=>merged.push(Object.assign({}, l, { ids:[l.id] })));
    } else {
      arr.forEach(l=>merged.push(Object.assign({}, l, { ids:[l.id] })));
    }
  });

  // 再把連續上班日合併成一段
  const sorted = merged.sort((a,b)=> a.name.localeCompare(b.name) || a.type.localeCompare(b.type) || a.date.localeCompare(b.date));
  const groups = [];
  sorted.forEach(l=>{
    const g = groups[groups.length-1];
    if (g && g.name===l.name && g.type===l.type && g.slot===l.slot && g.reason===l.reason && nextWorkday(g.end)===l.date){
      g.end = l.date; g.ids.push(...l.ids); g.days++;
    } else {
      groups.push({ name:l.name, type:l.type, slot:l.slot, reason:l.reason, start:l.date, end:l.date, ids:l.ids.slice(), days:1 });
    }
  });
  return groups.sort((a,b)=>a.start.localeCompare(b.start));
}

function renderUpcoming(){
  const box=$('upcoming'); box.className='';
  if(!upcoming.length){ box.innerHTML='<div class="muted" style="padding:8px 0">接下來 90 天沒有人請假</div>'; return; }
  box.innerHTML = groupLeaves(upcoming).map((g,i)=>{
    const [, sm, sd] = parts(g.start);
    const c = colorOf[g.name]||'#666';
    const when = g.start===g.end
      ? (g.slot!=='全天' ? g.slot : '全天')
      : `到 ${shortDate(g.end)}・共 ${g.days} 天`;
    return `
    <div class="item">
      <div class="datebox"><div class="dm" style="background:${c}">${sm} 月</div><div class="dd">${sd}</div><div class="dw">週${WD[wdIdx(g.start)]}</div></div>
      <div class="info">
        <div class="who">${esc(g.name)}<span class="tag ${isAlt(g.type)?'alt':''}">${esc(g.type)}</span></div>
        <div class="when muted">${esc(when)}</div>
        ${g.reason?`<div class="muted" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(g.reason)}</div>`:''}
      </div>
      ${g.name===NAME?`<button class="danger" onclick="cancelGroup(${i})">取消</button>`:''}
    </div>`;
  }).join('');
  renderUpcoming._groups = groupLeaves(upcoming);
}

function cancelGroup(i){
  const g = renderUpcoming._groups[i];
  const range = g.start===g.end ? shortDate(g.start) : `${shortDate(g.start)} – ${shortDate(g.end)}（${g.days} 天）`;
  if(!confirm(`確定取消 ${range} 的${g.type}？`)) return;
  api('cancelLeave', g.ids).then(r=>{ toast(`已取消 ${r.count} 天`); refresh(); }).catch(e=>toast(e.message));
}

/* ---------- 請假 ---------- */

/** 有選日期 → 表單顯示已選日期；沒選 → 顯示開始／結束日 */
function openForm(){
  const dates = [...SEL].sort();
  const useSel = dates.length > 0;
  $('selBox').style.display = useSel ? '' : 'none';
  $('rangeBox').style.display = useSel ? 'none' : '';
  $('skipTxt').style.display = useSel ? 'none' : '';
  if (useSel) {
    $('selChips').innerHTML = dates.map(d=>`<span>${esc(shortDate(d))}</span>`).join('');
    const f = commonFree(dates);
    $('fType').value = f.type; $('fSlot').value = f.slot;
  } else {
    $('fStart').value = INIT.today; $('fEnd').value = INIT.today;
    $('fStart').min = INIT.today; $('fEnd').min = INIT.today;
    $('fType').value = INIT.types[0]; $('fSlot').value = '全天';
  }
  $('formName').textContent = NAME;
  $('fReason').value=''; showErr('fErr','');
  openMask('formMask');
}
/* 選了開始日，結束日自動跟著變成同一天；要請多天再改結束日 */
$('fStart').addEventListener('change', e=>{ $('fEnd').value = e.target.value; });

function submitForm(){
  const dates = [...SEL].sort();
  const p = { type:$('fType').value, slot:$('fSlot').value, reason:$('fReason').value.trim() };
  if (dates.length) p.dates = dates;
  else { p.start = $('fStart').value; p.end = $('fEnd').value; }
  showErr('fErr','');
  if (!dates.length && (!p.start || !p.end)) return showErr('fErr','請選擇日期');
  const btn=$('fSubmit'); btn.disabled=true; btn.textContent='送出中…';
  api('submitLeave', p).then(r=>{
    if(!r.ok){ showErr('fErr','無法送出：\n'+r.conflicts.join('\n')); refresh(); return; }   // 可能剛被別人搶先，重新載入月曆
    closeMask('formMask'); SEL.clear(); afterSel(); toast(`已登記 ${r.dates.length} 天`); refresh();
  }).catch(e=>showErr('fErr',e.message)).finally(()=>{ btn.disabled=false; btn.textContent='送出'; });
}

/* ---------- 改 PIN ---------- */

function openPin(force, oldPin){
  FORCE = !!force; FORCE_OLD = oldPin || '';
  ['pOld','pNew','pNew2'].forEach(i=>$(i).value=''); showErr('pErr','');
  $('pTitle').textContent = FORCE ? '設定你的 PIN 碼' : '修改 PIN 碼';
  $('pHint').style.display = FORCE ? 'block' : 'none';
  $('pCancel').style.display = FORCE ? 'none' : '';
  $('pOldBox').style.display = (FORCE && FORCE_OLD) ? 'none' : '';
  openMask('pinMask');
}
function submitPin(){
  const o = (FORCE && FORCE_OLD) ? FORCE_OLD : $('pOld').value.trim();
  const n=$('pNew').value.trim(), n2=$('pNew2').value.trim();
  if(!/^\d{4,8}$/.test(n)) return showErr('pErr','新 PIN 需為 4–8 位數字');
  if(n!==n2) return showErr('pErr','兩次輸入的新 PIN 不一樣');
  const btn=$('pSubmit'); btn.disabled=true;
  api('changePin', o, n).then(r=>{
    if(!r.ok) return showErr('pErr', r.msg);
    TOKEN=r.token; store('leave_token',TOKEN);
    const wasForce = FORCE; FORCE=false; FORCE_OLD='';
    closeMask('pinMask'); toast('PIN 已設定');
    if (wasForce) showApp();
  }).catch(e=>showErr('pErr',e.message)).finally(()=>btn.disabled=false);
}
